<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>퍼즐 모음</title>
<meta name="theme-color" content="#2b2b32">
<style>
  :root {
    --bg: #2b2b32;
    --panel: #3a3a44;
    --text: #f2f2f5;
    --muted: #b6b6c2;
    --accent: #7bc96f;
    --border: #55555f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 40px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    touch-action: manipulation;
    -webkit-text-size-adjust: 100%;
  }

  h1 {
    margin: 0;
    font-size: clamp(22px, 6vw, 32px);
    letter-spacing: 1px;
  }

  p.lead {
    margin: 0 0 20px;
    color: var(--muted);
    font-size: 15px;
    text-align: center;
  }

  .apps {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
    max-width: 460px;
  }

  a.app {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    color: inherit;
    text-decoration: none;
    min-height: 72px;
  }

  a.app:active { border-color: var(--accent); }
  @media (hover: hover) {
    a.app:hover { border-color: var(--accent); }
  }

  .app .icon {
    width: 52px; height: 52px; flex: 0 0 52px;
    border-radius: 11px; display: block;
    box-shadow: 0 2px 8px rgba(0,0,0,.35);
  }
  .app .name { display: block; font-size: 18px; font-weight: bold; }
  .app .desc { display: block; font-size: 13px; color: var(--muted); margin-top: 4px; line-height: 1.45; }

  footer {
    margin-top: 28px;
    font-size: 13px;
    color: var(--muted);
    text-align: center;
  }

  footer a { color: var(--accent); }
</style>
</head>
<body>

  <h1>퍼즐 모음</h1>
  <p class="lead">브라우저에서 바로 실행되는 퍼즐 앱들입니다. 설치 없이 눌러서 실행하세요.</p>

  <div class="apps">
    <a class="app" href="sudoku/">
      <img class="icon" src="sudoku/icon-192.png" alt="" width="52" height="52">
      <span>
        <span class="name">스도쿠</span>
        <span class="desc">유일해가 보장된 퍼즐을 난이도 4단계로. 메모·되돌리기·힌트·기록 저장</span>
      </span>
    </a>
    <a class="app" href="nqueens/">
      <img class="icon" src="nqueens/icon-192.png" alt="" width="52" height="52">
      <span>
        <span class="name">N-Queens 퍼즐</span>
        <span class="desc">N×N 보드에 퀸 N개를 서로 공격하지 않게 배치 (N=4~10, 타이머·힌트·다크모드)</span>
      </span>
    </a>
  </div>

  <footer>
    소스: <a href="https://github.com/junorion/app_development">github.com/junorion/app_development</a>
  </footer>

</body>
</html>
