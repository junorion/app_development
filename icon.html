<!DOCTYPE html>
<!-- 앱 아이콘 원본. .claude/skills/app-icon 의 render_icon.sh 가 512px 로 찍어
     icon-512.png · icon-192.png 를 만든다. maskable 아이콘이라 배경은 가장자리까지 채우고,
     그림은 가운데 80% 안전 영역 안에 둔다. -->
<html><head><meta charset="UTF-8">
<style>
  html, body { margin: 0; width: 512px; height: 512px; overflow: hidden; }
  body { background: linear-gradient(145deg, #2a2f45, #14161c); display: grid; place-items: center; }
</style></head>
<body>
<svg width="300" height="300" viewBox="0 0 100 100">
  <rect x="8" y="8" width="38" height="38" rx="9" fill="#7c8cff"/>
  <rect x="54" y="8" width="38" height="38" rx="9" fill="#eef0f5" opacity=".9"/>
  <rect x="8" y="54" width="38" height="38" rx="9" fill="#eef0f5" opacity=".9"/>
  <rect x="54" y="54" width="38" height="38" rx="9" fill="#eef0f5" opacity=".35"/>
</svg>
</body></html>
