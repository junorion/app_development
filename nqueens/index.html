<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>N-Queens 퍼즐</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2b2b32">
<style>
  /* 다크(기본) 테마 팔레트 */
  :root, :root[data-theme="dark"] {
    --light: #f0d9b5;
    --dark: #b58863;
    --conflict: #e04b4b;
    --accent: #7bc96f;
    --bg: #2b2b32;
    --panel: #3a3a44;
    --text: #f2f2f5;
    --muted: #b6b6c2;
    --btn: #4a4a55;
    --btn-hover: #565663;
    --border: #55555f;
    --board-border: #1e1e24;
    --shadow: rgba(0, 0, 0, 0.45);
  }

  /* 라이트 테마 — 보드 칸 색은 체스판 느낌 그대로 두고 주변만 밝게 */
  :root[data-theme="light"] {
    --conflict: #d63b3b;
    --accent: #4fa843;
    --bg: #eef1f6;
    --panel: #ffffff;
    --text: #24262e;
    --muted: #626777;
    --btn: #e8ecf4;
    --btn-hover: #dae0ec;
    --border: #c6ccd8;
    --board-border: #8a6a4c;
    --shadow: rgba(60, 70, 90, 0.22);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 24px 12px;
    touch-action: manipulation;   /* 안드로이드 더블탭 확대(300ms 지연) 방지 */
    -webkit-text-size-adjust: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  h1 {
    margin: 0;
    font-size: clamp(20px, 5vw, 28px);
    letter-spacing: 1px;
  }

  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;              /* 태블릿 세로 화면에서 줄바꿈 */
    gap: 10px;
    max-width: 100%;
    background: var(--panel);
    padding: 14px clamp(10px, 3vw, 20px);
    border-radius: 10px;
    box-shadow: 0 2px 8px var(--shadow);
  }

  .controls label { font-size: 15px; }

  select, button {
    font-family: inherit;
    font-size: 15px;
    padding: 9px 14px;
    min-height: 40px;             /* 손가락으로 누를 수 있는 최소 크기 */
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--btn);
    color: var(--text);
    cursor: pointer;
  }

@media (hover: hover) {
    button:hover, select:hover { background: var(--btn-hover); }
  }

  /* 켜짐 상태인 토글 버튼 (힌트) */
  button.on {
    background: var(--accent);
    border-color: var(--accent);
    color: #14210f;
    font-weight: bold;
  }
@media (hover: hover) {
    button.on:hover { filter: brightness(1.06); background: var(--accent); }
  }

  /* 배치/남은 퀸 개수 · 경과 시간 */
  .stats {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 100%;
    gap: 10px;
  }

  .stat {
    background: var(--panel);
    border-radius: 8px;
    padding: 8px 18px;
    min-width: 92px;
    text-align: center;
    box-shadow: 0 2px 8px var(--shadow);
  }

  .stat .label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.5px;
  }

  .stat .value {
    display: block;
    font-size: 20px;
    font-weight: bold;
    font-variant-numeric: tabular-nums;
  }

  .status {
    font-size: 16px;
    min-height: 24px;
    text-align: center;
  }

  .status .warn { color: var(--conflict); font-weight: bold; }
  .status .hint { color: var(--accent); font-weight: bold; }

  #board {
    /* 가로 폭과 세로 높이 중 더 빡빡한 쪽에 맞춘다. 56px 이 상한, 26px 이 하한. */
    --cell: max(26px, min(56px,
                          calc((100vw - 28px) / var(--n)),
                          calc((100vh - 300px) / var(--n))));
    display: grid;
    grid-template-columns: repeat(var(--n), var(--cell));
    gap: 0;
    border: 4px solid var(--board-border);
    border-radius: 4px;
    box-shadow: 0 8px 24px var(--shadow);
  }

  .cell {
    width: var(--cell);
    height: var(--cell);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: calc(var(--cell) * 0.68);
    line-height: 1;
    cursor: pointer;
    user-select: none;
    transition: background-color 0.12s ease;
  }

  .cell.light { background: var(--light); }
  .cell.dark  { background: var(--dark); }
@media (hover: hover) {
    .cell:hover { filter: brightness(1.12); }
  }

  .cell .queen { color: #1c1c22; text-shadow: 0 1px 2px rgba(255,255,255,0.35); }

  /* 서로 공격 가능한 퀸이 놓인 칸 */
  .cell.conflict { background: var(--conflict) !important; }
  .cell.conflict .queen { color: #ffffff; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }

  /* 힌트: 지금 퀸을 놓아도 안전한 빈 칸 */
  .cell.safe::after {
    content: "";
    width: calc(var(--cell) * 0.29);
    height: calc(var(--cell) * 0.29);
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px rgba(123, 201, 111, 0.35);
    animation: pulse 1.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.55; transform: scale(0.85); }
    50%      { opacity: 1;    transform: scale(1); }
  }

  @supports (height: 100svh) {
    #board {
      --cell: max(26px, min(56px,
                            calc((100vw - 28px) / var(--n)),
                            calc((100svh - 300px) / var(--n))));
    }
  }

  .banner {
    background: var(--accent);
    color: #14210f;
    font-size: clamp(16px, 4vw, 20px);
    font-weight: bold;
    padding: 14px 28px;
    text-align: center;
    border-radius: 10px;
    animation: pop 0.4s ease;
  }

  .banner.hidden { display: none; }

  @keyframes pop {
    0%   { transform: scale(0.7); opacity: 0; }
    60%  { transform: scale(1.06); }
    100% { transform: scale(1); opacity: 1; }
  }

  /* 세로 공간이 좁을 때(가로 모드 태블릿·폰) 여백을 줄여 보드에 높이를 더 준다 */
  @media (max-height: 720px) {
    body { padding: 12px; gap: 10px; }
    h1 { font-size: clamp(18px, 4vw, 22px); }
    .controls { padding: 8px clamp(10px, 3vw, 16px); }
    .stat { padding: 5px 14px; min-width: 84px; }
    .stat .value { font-size: 17px; }
    .status { min-height: 20px; font-size: 15px; }

    #board {
      --cell: max(26px, min(56px,
                            calc((100vw - 28px) / var(--n)),
                            calc((100vh - 240px) / var(--n))));
    }
    @supports (height: 100svh) {
      #board {
        --cell: max(26px, min(56px,
                              calc((100vw - 28px) / var(--n)),
                              calc((100svh - 240px) / var(--n))));
      }
    }
  }
</style>
</head>
<body>

  <h1>👑 N-Queens 퍼즐</h1>

  <div class="controls">
    <label for="size">보드 크기 N:</label>
    <select id="size"></select>
    <button id="reset">리셋</button>
    <button id="hint">💡 힌트</button>
    <button id="theme">☀️ 라이트</button>
  </div>

  <div class="stats">
    <div class="stat"><span class="label">배치한 퀸</span><span class="value" id="placed">0</span></div>
    <div class="stat"><span class="label">남은 퀸</span><span class="value" id="remaining">0</span></div>
    <div class="stat"><span class="label">경과 시간</span><span class="value" id="time">00:00</span></div>
  </div>

  <div id="banner" class="banner hidden">🎉 성공! 모든 퀸을 안전하게 배치했습니다!</div>

  <div class="status" id="status"></div>

  <div id="board"></div>

<script>
"use strict";

const MIN_N = 4;
const MAX_N = 10;
const THEME_KEY = "nqueens-theme";

let n = 8;                  // 현재 보드 크기
let board = [];             // board[r][c] === true 이면 그 칸에 퀸이 있음
let hintOn = false;         // 힌트(안전한 칸 표시) 켜짐 여부

const boardEl     = document.getElementById("board");
const statusEl    = document.getElementById("status");
const bannerEl    = document.getElementById("banner");
const sizeEl      = document.getElementById("size");
const placedEl    = document.getElementById("placed");
const remainingEl = document.getElementById("remaining");
const timeEl      = document.getElementById("time");
const hintBtn     = document.getElementById("hint");
const themeBtn    = document.getElementById("theme");

/* ---------- 상태 초기화 ---------- */

// 크기 size 의 빈 보드를 만든다.
function createBoard(size) {
  n = size;
  board = [];
  for (let r = 0; r < n; r++) {
    board.push(new Array(n).fill(false));
  }
  resetTimer();
}

/* ---------- 게임 로직 ---------- */

// 현재 놓인 퀸의 좌표 목록 [{r, c}, ...]
function getQueens() {
  const queens = [];
  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) {
      if (board[r][c]) queens.push({ r, c });
    }
  }
  return queens;
}

// 두 퀸이 서로 공격 가능한가? (같은 행 / 같은 열 / 같은 대각선)
function attacks(a, b) {
  return a.r === b.r
      || a.c === b.c
      || Math.abs(a.r - b.r) === Math.abs(a.c - b.c);
}

// 다른 퀸과 충돌하는 퀸들의 좌표를 "r,c" 문자열 Set 으로 반환한다.
function checkConflicts() {
  const queens = getQueens();
  const conflicts = new Set();
  for (let i = 0; i < queens.length; i++) {
    for (let j = i + 1; j < queens.length; j++) {
      if (attacks(queens[i], queens[j])) {
        conflicts.add(queens[i].r + "," + queens[i].c);
        conflicts.add(queens[j].r + "," + queens[j].c);
      }
    }
  }
  return conflicts;
}

// 힌트용: 기존 퀸 누구에게도 공격받지 않는 빈 칸들의 "r,c" Set.
function findSafeCells() {
  const queens = getQueens();
  const safe = new Set();
  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) {
      if (board[r][c]) continue;
      if (!queens.some((q) => attacks(q, { r, c }))) {
        safe.add(r + "," + c);
      }
    }
  }
  return safe;
}

// 퀸이 정확히 N개이고 충돌이 하나도 없으면 클리어.
function checkWin(conflicts) {
  return getQueens().length === n && conflicts.size === 0;
}

// 칸을 클릭했을 때: 빈 칸이면 퀸 배치, 퀸이 있으면 제거 (토글).
function toggleQueen(r, c) {
  board[r][c] = !board[r][c];
  if (board[r][c]) startTimer();   // 첫 퀸을 놓는 순간부터 시간 측정
  updateView();
}

/* ---------- 타이머 ---------- */

let timerRunning = false;
let timerStartedAt = 0;   // 현재 구간이 시작된 시각
let accumulatedMs = 0;    // 이전 구간들의 합
let tickId = null;

function elapsedMs() {
  return accumulatedMs + (timerRunning ? Date.now() - timerStartedAt : 0);
}

function startTimer() {
  if (timerRunning) return;
  timerRunning = true;
  timerStartedAt = Date.now();
  tickId = setInterval(renderTime, 250);
  renderTime();
}

function stopTimer() {
  if (!timerRunning) return;
  accumulatedMs += Date.now() - timerStartedAt;
  timerRunning = false;
  clearInterval(tickId);
  tickId = null;
  renderTime();
}

function resetTimer() {
  stopTimer();
  accumulatedMs = 0;
  renderTime();
}

// ms 를 mm:ss 로 (1시간을 넘기면 분이 60 이상으로 계속 늘어난다)
function formatTime(ms) {
  const total = Math.floor(ms / 1000);
  const mm = String(Math.floor(total / 60)).padStart(2, "0");
  const ss = String(total % 60).padStart(2, "0");
  return mm + ":" + ss;
}

function renderTime() {
  timeEl.textContent = formatTime(elapsedMs());
}

/* ---------- 테마 ---------- */

function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = theme === "dark" ? "#2b2b32" : "#eef1f6";
  // 버튼은 "누르면 바뀔 테마"를 보여준다.
  themeBtn.textContent = theme === "dark" ? "☀️ 라이트" : "🌙 다크";
  try {
    localStorage.setItem(THEME_KEY, theme);
  } catch (e) {
    /* file:// 등에서 저장이 막혀 있어도 동작에는 지장 없음 */
  }
}

function loadTheme() {
  try {
    return localStorage.getItem(THEME_KEY) === "light" ? "light" : "dark";
  } catch (e) {
    return "dark";
  }
}

/* ---------- 화면 그리기 ---------- */

// N×N 격자 DOM 을 새로 만든다. (N 이 바뀌거나 리셋할 때만 호출)
function renderBoard() {
  boardEl.innerHTML = "";
  boardEl.style.setProperty("--n", n);   // 칸 크기는 CSS 가 화면에 맞춰 계산한다

  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) {
      const cell = document.createElement("div");
      cell.className = "cell " + ((r + c) % 2 === 0 ? "light" : "dark");
      cell.dataset.r = r;
      cell.dataset.c = c;
      boardEl.appendChild(cell);
    }
  }
  updateView();
}

// 퀸 표시 · 충돌 강조 · 힌트 · 개수/시간 · 상태 문구를 현재 board 상태에 맞춰 갱신한다.
function updateView() {
  const conflicts = checkConflicts();
  const placed = getQueens().length;
  const safe = hintOn ? findSafeCells() : new Set();

  for (const cell of boardEl.children) {
    const r = Number(cell.dataset.r);
    const c = Number(cell.dataset.c);
    const key = r + "," + c;

    cell.innerHTML = board[r][c] ? '<span class="queen">♛</span>' : "";
    cell.classList.toggle("conflict", conflicts.has(key));
    cell.classList.toggle("safe", safe.has(key));
  }

  placedEl.textContent = placed;
  remainingEl.textContent = Math.max(0, n - placed);

  const won = checkWin(conflicts);
  bannerEl.classList.toggle("hidden", !won);
  if (won) stopTimer();

  if (won) {
    statusEl.textContent = `충돌 없이 ${n}개 완성 — 기록 ${formatTime(elapsedMs())}`;
  } else if (conflicts.size > 0) {
    statusEl.innerHTML = `<span class="warn">충돌한 퀸 ${conflicts.size}개</span> — 빨간 칸의 퀸을 옮기세요`;
  } else if (hintOn) {
    statusEl.innerHTML = safe.size > 0
      ? `<span class="hint">안전한 칸 ${safe.size}개</span> — 초록 점 위에 놓을 수 있습니다`
      : `<span class="warn">놓을 수 있는 안전한 칸이 없습니다</span> — 퀸을 옮겨보세요`;
  } else {
    statusEl.textContent = `앞으로 ${n - placed}개 더 놓으세요`;
  }
}

/* ---------- 이벤트 연결 ---------- */

// N 선택 드롭다운 채우기
for (let size = MIN_N; size <= MAX_N; size++) {
  const opt = document.createElement("option");
  opt.value = size;
  opt.textContent = `${size} × ${size}`;
  sizeEl.appendChild(opt);
}
sizeEl.value = n;

sizeEl.addEventListener("change", () => {
  createBoard(Number(sizeEl.value));
  renderBoard();
});

document.getElementById("reset").addEventListener("click", () => {
  createBoard(n);
  renderBoard();
});

hintBtn.addEventListener("click", () => {
  hintOn = !hintOn;
  hintBtn.classList.toggle("on", hintOn);
  updateView();
});

themeBtn.addEventListener("click", () => {
  applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
});

boardEl.addEventListener("click", (e) => {
  const cell = e.target.closest(".cell");
  if (!cell) return;
  toggleQueen(Number(cell.dataset.r), Number(cell.dataset.c));
});

/* ---------- service worker (오프라인 실행 · 앱 설치) ---------- */

// https 또는 localhost 에서만 등록된다. file:// 로 열면 조용히 건너뛴다.
const swAllowed = location.protocol === "https:"
               || ["localhost", "127.0.0.1"].includes(location.hostname);
if ("serviceWorker" in navigator && swAllowed) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {
      /* 등록에 실패해도 앱 자체는 그대로 동작한다 */
    });
  });

  // 새 버전이 자리를 넘겨받으면 한 번만 새로고침한다.
  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (reloading) return;
    reloading = true;
    location.reload();
  });
}

/* ---------- 시작 ---------- */

applyTheme(loadTheme());
createBoard(n);
renderBoard();
</script>

</body>
</html>
