<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>N-Queens 퍼즐</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f1a16">
<style>
  /* ===== 팔레트 =====================================================
     보드(목재·상아)는 두 테마에서 동일하게 유지하고, 주변 UI 색만 바꾼다.
     그래야 체스판 자체의 재질감이 테마와 무관하게 일정하게 보인다. */
  :root, :root[data-theme="dark"] {
    --sq-light-a: #f2ddb9;  --sq-light-b: #e4c99b;
    --sq-dark-a:  #ba8459;  --sq-dark-b:  #9d6c45;
    --frame-a: #6d4526;  --frame-b: #4a2e18;  --frame-edge: #331e0e;
    --coord: #e8cfa8;
    --piece-a: #fffaf0;  --piece-b: #d9c49c;  --piece-line: #6b543a;
    --danger: #d8402f;   --accent: #78c06a;   --gold: #e8b44a;

    --bg-a: #221d19;  --bg-b: #14110f;
    --panel: rgba(255, 250, 244, 0.07);
    --panel-line: rgba(255, 240, 220, 0.14);
    --text: #f4ece1;
    --muted: #b2a596;
    --btn: rgba(255, 248, 238, 0.09);
    --btn-hover: rgba(255, 248, 238, 0.16);
    --shadow-1: 0 1px 2px rgba(0,0,0,0.5);
    --shadow-2: 0 18px 44px rgba(0,0,0,0.55), 0 4px 10px rgba(0,0,0,0.4);
  }

  :root[data-theme="light"] {
    --bg-a: #f6efe4;  --bg-b: #e7dbc8;
    --panel: rgba(255, 255, 255, 0.78);
    --panel-line: rgba(90, 65, 40, 0.16);
    --text: #35281c;
    --muted: #7d6a56;
    --btn: rgba(255, 255, 255, 0.85);
    --btn-hover: #ffffff;
    --danger: #c3341f;
    --accent: #4d9640;
    --shadow-1: 0 1px 2px rgba(90, 65, 40, 0.18);
    --shadow-2: 0 16px 36px rgba(90, 65, 40, 0.26), 0 3px 8px rgba(90, 65, 40, 0.18);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 22px 12px 28px;
    min-height: 100vh;
    background: radial-gradient(120% 90% at 50% 0%, var(--bg-a), var(--bg-b));
    color: var(--text);
    font-family: "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    touch-action: manipulation;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }

  h1 {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(19px, 4.6vw, 27px);
    font-weight: 600;
    letter-spacing: 0.06em;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  h1 .mark { width: 1.1em; height: 1.1em; color: var(--gold); }

  /* ===== 컨트롤 ===================================================== */
  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    max-width: 100%;
    padding: 9px clamp(9px, 2.5vw, 14px);
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 14px;
    backdrop-filter: blur(6px);
    box-shadow: var(--shadow-1);
  }

  .controls label { font-size: 14px; color: var(--muted); }

  select, button {
    font-family: inherit;
    font-size: 14px;
    color: var(--text);
    background: var(--btn);
    border: 1px solid var(--panel-line);
    border-radius: 10px;
    padding: 0 12px;
    min-height: 40px;
    cursor: pointer;
    transition: background-color 0.15s ease, transform 0.1s ease, border-color 0.15s ease;
  }

  button {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  button .ico { width: 17px; height: 17px; flex: none; }

  button:active { transform: scale(0.96); }

  @media (hover: hover) {
    button:hover, select:hover { background: var(--btn-hover); }
  }

  button.on {
    background: var(--accent);
    border-color: transparent;
    color: #10240c;
    font-weight: 600;
  }

  /* ===== 스탯 ======================================================= */
  .stats {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 100%;
    gap: 8px;
  }

  .stat {
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 12px;
    padding: 6px 16px;
    min-width: 86px;
    text-align: center;
    box-shadow: var(--shadow-1);
  }

  .stat .label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--muted);
  }

  .stat .value {
    display: block;
    font-size: 19px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1.25;
  }

  .status {
    font-size: 14.5px;
    min-height: 21px;
    color: var(--muted);
    text-align: center;
  }

  .status .warn { color: var(--danger); font-weight: 600; }
  .status .hint { color: var(--accent); font-weight: 600; }

  /* ===== 보드 프레임 ================================================ */
  #frame {
    /* 가로 폭과 세로 높이 중 더 빡빡한 쪽에 맞춘다. 56px 이 상한, 26px 이 하한. */
    --cell: max(26px, min(56px,
                          calc((100vw - 72px) / var(--n)),
                          calc((100vh - 350px) / var(--n))));
    --pad: clamp(9px, 1.8vw, 16px);

    display: grid;
    grid-template-columns: auto auto;
    grid-template-areas: "ranks board" "corner files";
    padding: var(--pad);
    border-radius: 12px;
    background:
      repeating-linear-gradient(97deg, rgba(255,255,255,0.045) 0 2px, transparent 2px 7px),
      linear-gradient(150deg, var(--frame-a), var(--frame-b));
    border: 1px solid var(--frame-edge);
    box-shadow: var(--shadow-2), inset 0 1px 0 rgba(255, 226, 190, 0.25);
  }

  .coords {
    display: grid;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(9px, calc(var(--cell) * 0.24), 12px);
    color: var(--coord);
    opacity: 0.75;
    user-select: none;
  }

  .coords.ranks {
    grid-area: ranks;
    grid-template-rows: repeat(var(--n), var(--cell));
    align-items: center;
    justify-items: center;
    width: 1.5em;
  }

  .coords.files {
    grid-area: files;
    grid-template-columns: repeat(var(--n), var(--cell));
    justify-items: center;
    padding-top: 2px;
    height: 1.4em;
  }

  .board-area {
    grid-area: board;
    position: relative;
    border-radius: 3px;
    overflow: hidden;
    box-shadow:
      inset 0 0 0 1px rgba(60, 35, 15, 0.55),
      0 2px 6px rgba(0, 0, 0, 0.35);
  }

  /* 판 전체에 은은한 비네트 — 칸 위에 얹되 클릭은 통과시킨다 */
  .board-area::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(115% 95% at 50% 8%, transparent 55%, rgba(45, 25, 10, 0.28));
  }

  #board {
    display: grid;
    grid-template-columns: repeat(var(--n), var(--cell));
  }

  .cell {
    position: relative;
    width: var(--cell);
    height: var(--cell);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
  }

  .cell.light {
    background:
      repeating-linear-gradient(83deg, rgba(150, 105, 60, 0.05) 0 1px, transparent 1px 5px),
      linear-gradient(158deg, var(--sq-light-a), var(--sq-light-b));
  }

  .cell.dark {
    background:
      repeating-linear-gradient(83deg, rgba(60, 35, 15, 0.07) 0 1px, transparent 1px 5px),
      linear-gradient(158deg, var(--sq-dark-a), var(--sq-dark-b));
  }

  @media (hover: hover) {
    .cell:hover::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.14);
    }
  }

  /* ===== 퀸 말 ====================================================== */
  .piece {
    position: relative;
    width: 78%;
    height: 78%;
    opacity: 0;
    transform: scale(0.45) translateY(6%);
    transition: opacity 0.14s ease, transform 0.22s cubic-bezier(0.22, 1.4, 0.36, 1);
    filter: drop-shadow(0 calc(var(--cell) * 0.045) calc(var(--cell) * 0.06) rgba(52, 28, 10, 0.5));
    pointer-events: none;
  }

  .cell.has-queen .piece { opacity: 1; transform: scale(1); }

  .piece svg { width: 100%; height: 100%; display: block; }

  /* 충돌한 퀸: 붉은 기운 + 한 번 흔들림 */
  .cell.conflict .piece { filter: drop-shadow(0 0 calc(var(--cell) * 0.14) rgba(216, 64, 47, 0.95)); }
  .cell.conflict .piece .pc-body { fill: url(#pieceDanger); }

  .cell.shake .piece { animation: shake 0.34s ease; }

  @keyframes shake {
    0%, 100% { transform: scale(1) translateX(0); }
    20% { transform: scale(1) translateX(-9%) rotate(-4deg); }
    50% { transform: scale(1) translateX(7%) rotate(3deg); }
    80% { transform: scale(1) translateX(-3%); }
  }

  /* 충돌 칸 바닥의 붉은 얼룩 */
  .cell.conflict::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 55%, rgba(216, 64, 47, 0.55), rgba(216, 64, 47, 0.12) 70%, transparent);
  }

  /* ===== 힌트(안전한 칸) ============================================ */
  .cell.safe::after {
    content: "";
    position: absolute;
    width: 26%;
    height: 26%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #a9e59c, var(--accent));
    box-shadow: 0 0 0 3px rgba(120, 192, 106, 0.28), 0 1px 2px rgba(0,0,0,0.35);
    animation: breathe 1.8s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.6; transform: scale(0.82); }
    50%      { opacity: 1;   transform: scale(1); }
  }

  /* ===== 공격선 ===================================================== */
  #rays {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  #rays line {
    stroke: rgba(216, 64, 47, 0.75);
    stroke-width: 0.055;
    stroke-linecap: round;
    filter: drop-shadow(0 0 0.04px rgba(216, 64, 47, 0.9));
    animation: rayIn 0.22s ease-out;
  }

  @keyframes rayIn { from { opacity: 0; } to { opacity: 1; } }

  /* ===== 성공 연출 ================================================== */
  .board-area.won::after {
    background: radial-gradient(115% 95% at 50% 8%, transparent 55%, rgba(45, 25, 10, 0.28));
    box-shadow: inset 0 0 0 3px var(--gold), inset 0 0 30px rgba(232, 180, 74, 0.45);
    animation: winGlow 1.1s ease-out;
  }

  @keyframes winGlow {
    0%   { box-shadow: inset 0 0 0 3px rgba(232,180,74,0), inset 0 0 0 rgba(232,180,74,0); }
    45%  { box-shadow: inset 0 0 0 3px var(--gold), inset 0 0 60px rgba(232, 180, 74, 0.8); }
    100% { box-shadow: inset 0 0 0 3px var(--gold), inset 0 0 30px rgba(232, 180, 74, 0.45); }
  }

  .banner {
    display: flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(140deg, #f6cd72, var(--gold));
    color: #3a2708;
    font-size: clamp(15px, 3.6vw, 18px);
    font-weight: 700;
    padding: 11px 22px;
    border-radius: 12px;
    box-shadow: var(--shadow-1), 0 8px 22px rgba(232, 180, 74, 0.3);
    animation: pop 0.45s cubic-bezier(0.22, 1.4, 0.36, 1);
  }

  .banner .ico { width: 20px; height: 20px; flex: none; }
  .banner.hidden { display: none; }

  @keyframes pop {
    0%   { transform: scale(0.7) translateY(6px); opacity: 0; }
    60%  { transform: scale(1.05); }
    100% { transform: scale(1); opacity: 1; }
  }

  /* 세로 공간이 좁을 때(가로 모드) 여백을 줄여 보드에 높이를 더 준다 */
  @media (max-height: 720px) {
    body { padding: 10px 10px 14px; gap: 10px; }
    h1 { font-size: clamp(17px, 3.6vw, 21px); }
    .stat { padding: 4px 13px; min-width: 78px; }
    .stat .value { font-size: 17px; }
    .status { min-height: 18px; font-size: 13.5px; }

    #frame {
      --cell: max(26px, min(56px,
                            calc((100vw - 72px) / var(--n)),
                            calc((100vh - 268px) / var(--n))));
    }
  }

  /* 모바일 브라우저의 주소창을 감안한 실제 높이를 쓸 수 있으면 그쪽을 쓴다 */
  @supports (height: 100svh) {
    #frame {
      --cell: max(26px, min(56px,
                            calc((100vw - 72px) / var(--n)),
                            calc((100svh - 350px) / var(--n))));
    }
    @media (max-height: 720px) {
      #frame {
        --cell: max(26px, min(56px,
                              calc((100vw - 72px) / var(--n)),
                              calc((100svh - 268px) / var(--n))));
      }
    }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<!-- 아이콘·말 정의. 화면에는 보이지 않고 <use> 로만 참조한다. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="pieceFill" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="var(--piece-a)"/>
      <stop offset="1" stop-color="var(--piece-b)"/>
    </linearGradient>

    <symbol id="queen" viewBox="0 0 100 100">
      <g class="pc-body" fill="url(#pieceFill)" stroke="var(--piece-line)"
         stroke-width="2.2" stroke-linejoin="round">
        <path d="M26 51 L20 29 L30 47 L36.5 20 L44 42 L50 14 L56 42 L63.5 20 L70 47 L80 29 L74 51 Z"/>
        <circle cx="20" cy="28" r="6.2"/>

        <circle cx="63.5" cy="19" r="5.6"/>
        <circle cx="80" cy="28" r="6.2"/>
        <rect x="30" y="50" width="40" height="7.5" rx="3.6"/>
        <path d="M36 58 C34.5 66, 31 71, 25.5 80 L74.5 80 C69 71, 65.5 66, 64 58 Z"/>
        <rect x="21" y="79" width="58" height="11" rx="4.6"/>
      </g>
      <path d="M40 60 C38 68, 34.5 73, 31 79" fill="none"
            stroke="rgba(255,255,255,0.7)" stroke-width="2.4" stroke-linecap="round"/>
    </symbol>

    <symbol id="i-crown" viewBox="0 0 24 24">
      <path d="M3 8l4 4 5-8 5 8 4-4-2 11H5L3 8z" fill="currentColor"/>
    </symbol>
    <symbol id="i-reset" viewBox="0 0 24 24">
      <path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z" fill="currentColor"/>
    </symbol>
    <symbol id="i-bulb" viewBox="0 0 24 24">
      <path d="M12 3a6 6 0 0 0-3.6 10.8V16h7.2v-2.2A6 6 0 0 0 12 3z" fill="currentColor"/>
      <path d="M9.4 18.3h5.2M10.6 20.8h2.8" fill="none" stroke="currentColor"
            stroke-width="1.9" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-sun" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="4.3" fill="currentColor"/>
      <path d="M12 1.8v3.1M12 19.1v3.1M1.8 12h3.1M19.1 12h3.1M4.8 4.8l2.2 2.2M17 17l2.2 2.2M19.2 4.8L17 7M7 17l-2.2 2.2"
            fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-moon" viewBox="0 0 24 24">
      <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z" fill="currentColor"/>
    </symbol>
  </defs>
</svg>

  <h1><svg class="mark"><use href="#i-crown"/></svg>N-Queens 퍼즐</h1>

  <div class="controls">
    <label for="size">보드 크기</label>
    <select id="size"></select>
    <button id="reset"><svg class="ico"><use href="#i-reset"/></svg>리셋</button>
    <button id="hint"><svg class="ico"><use href="#i-bulb"/></svg>힌트</button>
    <button id="theme"><svg class="ico"><use href="#i-sun"/></svg><span id="themeLabel">라이트</span></button>
  </div>

  <div class="stats">
    <div class="stat"><span class="label">배치한 퀸</span><span class="value" id="placed">0</span></div>
    <div class="stat"><span class="label">남은 퀸</span><span class="value" id="remaining">0</span></div>
    <div class="stat"><span class="label">경과 시간</span><span class="value" id="time">00:00</span></div>
  </div>

  <div id="banner" class="banner hidden">
    <svg class="ico"><use href="#i-crown"/></svg>성공! 모든 퀸이 안전합니다
  </div>

  <div class="status" id="status"></div>

  <div id="frame">
    <div class="coords ranks" id="ranks"></div>
    <div class="board-area" id="boardArea">
      <div id="board"></div>
      <svg id="rays" preserveAspectRatio="none"></svg>
    </div>
    <div class="coords files" id="files"></div>
  </div>

<script>
"use strict";

const MIN_N = 4;
const MAX_N = 10;
const THEME_KEY = "nqueens-theme";
const FILES = "abcdefghij";

let n = 8;                  // 현재 보드 크기
let board = [];             // board[r][c] === true 이면 그 칸에 퀸이 있음
let cells = [];             // cells[r][c] === 해당 칸의 DOM 요소
let hintOn = false;         // 힌트(안전한 칸 표시) 켜짐 여부
let prevConflicts = new Set();   // 직전 충돌 상태 — 새로 충돌한 칸만 흔든다

const frameEl     = document.getElementById("frame");
const boardEl     = document.getElementById("board");
const boardAreaEl = document.getElementById("boardArea");
const raysEl      = document.getElementById("rays");
const ranksEl     = document.getElementById("ranks");
const filesEl     = document.getElementById("files");
const statusEl    = document.getElementById("status");
const bannerEl    = document.getElementById("banner");
const sizeEl      = document.getElementById("size");
const placedEl    = document.getElementById("placed");
const remainingEl = document.getElementById("remaining");
const timeEl      = document.getElementById("time");
const hintBtn     = document.getElementById("hint");
const themeBtn    = document.getElementById("theme");

/* ---------- 상태 초기화 ---------- */

// 크기 size 의 빈 보드를 만든다.
function createBoard(size) {
  n = size;
  board = [];
  for (let r = 0; r < n; r++) {
    board.push(new Array(n).fill(false));
  }
  prevConflicts = new Set();
  resetTimer();
}

/* ---------- 게임 로직 ---------- */

// 현재 놓인 퀸의 좌표 목록 [{r, c}, ...]
function getQueens() {
  const queens = [];
  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) {
      if (board[r][c]) queens.push({ r, c });
    }
  }
  return queens;
}

// 두 퀸이 서로 공격 가능한가? (같은 행 / 같은 열 / 같은 대각선)
function attacks(a, b) {
  return a.r === b.r
      || a.c === b.c
      || Math.abs(a.r - b.r) === Math.abs(a.c - b.c);
}

// 서로 공격 중인 퀸 쌍 [[a, b], ...] — 충돌 표시와 공격선 그리기에 함께 쓴다.
function getAttackPairs() {
  const queens = getQueens();
  const pairs = [];
  for (let i = 0; i < queens.length; i++) {
    for (let j = i + 1; j < queens.length; j++) {
      if (attacks(queens[i], queens[j])) pairs.push([queens[i], queens[j]]);
    }
  }
  return pairs;
}

// 다른 퀸과 충돌하는 퀸들의 좌표를 "r,c" 문자열 Set 으로 반환한다.
function checkConflicts(pairs) {
  const conflicts = new Set();
  for (const [a, b] of pairs || getAttackPairs()) {
    conflicts.add(a.r + "," + a.c);
    conflicts.add(b.r + "," + b.c);
  }
  return conflicts;
}

// 힌트용: 기존 퀸 누구에게도 공격받지 않는 빈 칸들의 "r,c" Set.
function findSafeCells() {
  const queens = getQueens();
  const safe = new Set();
  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) {
      if (board[r][c]) continue;
      if (!queens.some((q) => attacks(q, { r, c }))) safe.add(r + "," + c);
    }
  }
  return safe;
}

// 퀸이 정확히 N개이고 충돌이 하나도 없으면 클리어.
function checkWin(conflicts) {
  return getQueens().length === n && conflicts.size === 0;
}

// 칸을 클릭했을 때: 빈 칸이면 퀸 배치, 퀸이 있으면 제거 (토글).
function toggleQueen(r, c) {
  board[r][c] = !board[r][c];
  if (board[r][c]) startTimer();   // 첫 퀸을 놓는 순간부터 시간 측정
  buzz(board[r][c] ? 12 : 6);
  updateView();
}

// 터치 기기에서의 짧은 진동 피드백 (지원하지 않으면 조용히 무시된다)
function buzz(ms) {
  try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* 무시 */ }
}

/* ---------- 타이머 ---------- */

let timerRunning = false;
let timerStartedAt = 0;   // 현재 구간이 시작된 시각
let accumulatedMs = 0;    // 이전 구간들의 합
let tickId = null;

function elapsedMs() {
  return accumulatedMs + (timerRunning ? Date.now() - timerStartedAt : 0);
}

function startTimer() {
  if (timerRunning) return;
  timerRunning = true;
  timerStartedAt = Date.now();
  tickId = setInterval(renderTime, 250);
  renderTime();
}

function stopTimer() {
  if (!timerRunning) return;
  accumulatedMs += Date.now() - timerStartedAt;
  timerRunning = false;
  clearInterval(tickId);
  tickId = null;
  renderTime();
}

function resetTimer() {
  stopTimer();
  accumulatedMs = 0;
  renderTime();
}

// ms 를 mm:ss 로 (1시간을 넘기면 분이 60 이상으로 계속 늘어난다)
function formatTime(ms) {
  const total = Math.floor(ms / 1000);
  const mm = String(Math.floor(total / 60)).padStart(2, "0");
  const ss = String(total % 60).padStart(2, "0");
  return mm + ":" + ss;
}

function renderTime() {
  timeEl.textContent = formatTime(elapsedMs());
}

/* ---------- 테마 ---------- */

function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  // 버튼은 "누르면 바뀔 테마"를 보여준다.
  const dark = theme === "dark";
  themeBtn.querySelector("use").setAttribute("href", dark ? "#i-sun" : "#i-moon");
  document.getElementById("themeLabel").textContent = dark ? "라이트" : "다크";
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = dark ? "#1f1a16" : "#f6efe4";
  try {
    localStorage.setItem(THEME_KEY, theme);
  } catch (e) {
    /* file:// 등에서 저장이 막혀 있어도 동작에는 지장 없음 */
  }
}

function loadTheme() {
  try {
    return localStorage.getItem(THEME_KEY) === "light" ? "light" : "dark";
  } catch (e) {
    return "dark";
  }
}

/* ---------- 화면 그리기 ---------- */

// N×N 격자와 좌표 레이블을 새로 만든다. (N 이 바뀌거나 리셋할 때만 호출)
// 칸 DOM 은 이후 재생성하지 않고 클래스만 토글한다 — 그래야 배치/제거 전이가 살아난다.
function renderBoard() {
  frameEl.style.setProperty("--n", n);   // 칸 크기는 CSS 가 화면에 맞춰 계산한다
  boardEl.innerHTML = "";
  cells = [];

  for (let r = 0; r < n; r++) {
    cells.push([]);
    for (let c = 0; c < n; c++) {
      const cell = document.createElement("div");
      cell.className = "cell " + ((r + c) % 2 === 0 ? "light" : "dark");
      cell.dataset.r = r;
      cell.dataset.c = c;
      cell.innerHTML = '<span class="piece"><svg viewBox="0 0 100 100"><use href="#queen"/></svg></span>';
      boardEl.appendChild(cell);
      cells[r].push(cell);
    }
  }

  ranksEl.innerHTML = "";
  filesEl.innerHTML = "";
  for (let r = 0; r < n; r++) {
    const d = document.createElement("div");
    d.textContent = n - r;
    ranksEl.appendChild(d);
  }
  for (let c = 0; c < n; c++) {
    const d = document.createElement("div");
    d.textContent = FILES[c];
    filesEl.appendChild(d);
  }

  raysEl.setAttribute("viewBox", `0 0 ${n} ${n}`);
  updateView();
}

// 서로 공격 중인 퀸들을 잇는 선을 보드 위에 그린다.
function drawRays(pairs) {
  raysEl.innerHTML = pairs.map(([a, b]) =>
    `<line x1="${a.c + 0.5}" y1="${a.r + 0.5}" x2="${b.c + 0.5}" y2="${b.r + 0.5}"/>`
  ).join("");
}

// 퀸 · 충돌 · 힌트 · 개수 · 상태 문구를 현재 board 상태에 맞춰 갱신한다.
function updateView() {
  const pairs = getAttackPairs();
  const conflicts = checkConflicts(pairs);
  const placed = getQueens().length;
  const safe = hintOn ? findSafeCells() : new Set();

  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) {
      const cell = cells[r][c];
      const key = r + "," + c;
      const inConflict = conflicts.has(key);

      cell.classList.toggle("has-queen", board[r][c]);
      cell.classList.toggle("conflict", inConflict);
      cell.classList.toggle("safe", safe.has(key));

      // 이번에 새로 충돌한 퀸만 한 번 흔든다 (매번 흔들면 산만하다)
      if (inConflict && !prevConflicts.has(key)) {
        cell.classList.remove("shake");
        void cell.offsetWidth;          // 애니메이션 재시작을 위한 리플로우
        cell.classList.add("shake");
      } else if (!inConflict) {
        cell.classList.remove("shake");
      }
    }
  }
  prevConflicts = conflicts;

  drawRays(pairs);

  placedEl.textContent = placed;
  remainingEl.textContent = Math.max(0, n - placed);

  const won = checkWin(conflicts);
  bannerEl.classList.toggle("hidden", !won);
  boardAreaEl.classList.toggle("won", won);
  if (won) {
    stopTimer();
    buzz([12, 60, 12]);
  }

  if (won) {
    statusEl.textContent = `충돌 없이 ${n}개 완성 — 기록 ${formatTime(elapsedMs())}`;
  } else if (conflicts.size > 0) {
    statusEl.innerHTML = `<span class="warn">충돌한 퀸 ${conflicts.size}개</span> — 붉은 선으로 이어진 퀸을 옮기세요`;
  } else if (hintOn) {
    statusEl.innerHTML = safe.size > 0
      ? `<span class="hint">안전한 칸 ${safe.size}개</span> — 초록 점 위에 놓을 수 있습니다`
      : `<span class="warn">놓을 수 있는 안전한 칸이 없습니다</span> — 퀸을 옮겨보세요`;
  } else {
    statusEl.textContent = `앞으로 ${n - placed}개 더 놓으세요`;
  }
}

/* ---------- 이벤트 연결 ---------- */

// N 선택 드롭다운 채우기
for (let size = MIN_N; size <= MAX_N; size++) {
  const opt = document.createElement("option");
  opt.value = size;
  opt.textContent = `${size} × ${size}`;
  sizeEl.appendChild(opt);
}
sizeEl.value = n;

sizeEl.addEventListener("change", () => {
  createBoard(Number(sizeEl.value));
  renderBoard();
});

document.getElementById("reset").addEventListener("click", () => {
  createBoard(n);
  renderBoard();
});

hintBtn.addEventListener("click", () => {
  hintOn = !hintOn;
  hintBtn.classList.toggle("on", hintOn);
  updateView();
});

themeBtn.addEventListener("click", () => {
  applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
});

boardEl.addEventListener("click", (e) => {
  const cell = e.target.closest(".cell");
  if (!cell) return;
  toggleQueen(Number(cell.dataset.r), Number(cell.dataset.c));
});

/* ---------- service worker (오프라인 실행 · 앱 설치) ---------- */

// https 또는 localhost 에서만 등록된다. file:// 로 열면 조용히 건너뛴다.
const swAllowed = location.protocol === "https:"
               || ["localhost", "127.0.0.1"].includes(location.hostname);
if ("serviceWorker" in navigator && swAllowed) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {
      /* 등록에 실패해도 앱 자체는 그대로 동작한다 */
    });
  });

  // 새 버전이 자리를 넘겨받으면 한 번만 새로고침한다.
  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (reloading) return;
    reloading = true;
    location.reload();
  });
}

/* ---------- 시작 ---------- */

applyTheme(loadTheme());
createBoard(n);
renderBoard();
</script>

</body>
</html>
