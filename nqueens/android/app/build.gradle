plugins {
    id "com.android.application"
}

/* 웹 앱 원본은 상위 nqueens/ 하나뿐이다. 안드로이드 프로젝트는 그것을 복사해서
   쓰기만 하고 사본을 저장소에 두지 않는다 — 고칠 곳이 두 군데가 되지 않게. */
def webRoot = rootProject.file("..")
def genDir  = file("${layout.buildDirectory.get().asFile}/generated/webapp")

def syncWebApp = tasks.register("syncWebApp", Copy) {
    description = "nqueens/ 의 웹 자산과 아이콘을 안드로이드 소스셋으로 복사한다"

    // sw.js 는 넣지 않는다 — file:///android_asset 에서는 service worker 가
    // 등록되지 않고, 앱에 파일이 내장되어 있어 오프라인 캐시도 필요 없다.
    from(webRoot) {
        include "index.html"
        include "manifest.webmanifest"
        include "icon-192.png"
        include "icon-512.png"
        into "assets"
    }
    // 런처 아이콘: 26 미만은 PNG 그대로, 26 이상은 adaptive-icon 의 배경 레이어로 쓴다.
    // 이름이 같으면 mipmap-anydpi-v26/ic_launcher.xml 이 자기 자신을 참조하므로 분리한다.
    from(webRoot) {
        include "icon-512.png"
        rename { "ic_launcher.png" }
        into "res/mipmap-xxxhdpi"
    }
    from(webRoot) {
        include "icon-512.png"
        rename { "ic_launcher_wood.png" }
        into "res/mipmap-xxxhdpi"
    }
    into genDir
}

android {
    namespace "com.junorion.nqueens"
    compileSdk 34

    defaultConfig {
        applicationId "com.junorion.nqueens"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    sourceSets {
        main {
            assets.srcDirs = ["${genDir}/assets"]
            res.srcDirs   += ["${genDir}/res"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

tasks.named("preBuild") { dependsOn syncWebApp }
