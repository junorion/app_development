<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>브레인 스도쿠 도쿠도쿠</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111420">
<style>
/* ===== 팔레트 ========================================================
   "브레인 스도쿠 도쿠도쿠" — 앞은 지적·전문적, 뒤는 친근함.
   차분한 남색 바탕에 인디고 강조색을 쓰고, 모서리와 그림자를 부드럽게 굴려
   딱딱해지지 않게 한다. 숫자는 고딕(산세리프).
   보드도 테마를 따라간다 — 어두운 화면에서 흰 판만 밝게 뜨면 눈이 아프다. */
:root, :root[data-theme="dark"] {
  --ui-bg:#111420;  --ui-panel:#1a1f2e; --ui-panel-2:#232a3c;
  --ui-text:#eaeefa; --ui-dim:#98a2ba; --ui-line:#2f374b;
  --accent:#8b8cf7; --accent-ink:#141628; --accent-soft:#282c4d;
  --shadow:0 16px 40px rgba(0,0,0,.5);

  --card:#1a2030; --card-edge:#2b3348;
  --rule:#2f3850; --rule-bold:#5a6486;
  --ink:#f2f5fc; --ink-user:#93b4ff; --ink-note:#7c869e; --ink-err:#ff8f9f;

  --cell-bg:#1a2030; --cell-peer:#212a3f; --cell-same:#2b3855;
  --cell-sel:#3a4a7a; --cell-err:#4a2733; --cell-err-sel:#6a2f42;
  --hl-unit:#1f2d3d; --hl-mark:#24455c; --hl-target:#2f6f96; --hl-ring:#6fc3ee;
  --flash:#3a3f78;
}
:root[data-theme="light"] {
  --ui-bg:#eef1f8;  --ui-panel:#ffffff; --ui-panel-2:#f3f5fb;
  --ui-text:#1e2333; --ui-dim:#6b7488; --ui-line:#dde2ee;
  --accent:#5b5bd6; --accent-ink:#ffffff; --accent-soft:#e7e8fb;
  --shadow:0 14px 34px rgba(35,45,80,.14);

  --card:#ffffff; --card-edge:#e2e7f2;
  --rule:#e4e8f2; --rule-bold:#39405a;
  --ink:#1e2333; --ink-user:#3a5ce0; --ink-note:#98a1b6; --ink-err:#d93a55;

  --cell-bg:#ffffff; --cell-peer:#f2f4fb; --cell-same:#dfe4fb;
  --cell-sel:#c7cffa; --cell-err:#fbdde2; --cell-err-sel:#f4c0ca;
  --hl-unit:#eaf3fb; --hl-mark:#cfe6f7; --hl-target:#9fd0f2; --hl-ring:#2a7fb8;
  --flash:#e6e8ff;
}

/* ===== 기본 레이아웃 ===== */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
  color: var(--ui-text);
  background: var(--ui-bg);
  -webkit-text-size-adjust: 100%;
  touch-action: manipulation;
  overflow-x: hidden;
}

#app {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: max(8px, env(safe-area-inset-top)) 10px
           max(10px, env(safe-area-inset-bottom));
}
/* 남는 세로 공간을 위아래로 나눠 가운데에 놓는다. auto 마진은 남는 공간이 없으면
   0이 되므로 justify-content: center 와 달리 위쪽이 잘릴 위험이 없다.
   .side 는 세로 화면에서 display:contents 라 선택자는 DOM 기준으로 써야 한다. */
#app > header { margin-top: auto; }
.side > .footer { margin-bottom: auto; }

/* 보드 한 칸의 크기. 가로/세로 중 더 빡빡한 쪽에 맞춘다.
   세로에서는 헤더·패드·컨트롤이 쓰는 높이를 빼고 남는 만큼만 준다. */
:root { --cell: 38px; --gap: 10px; }

/* ===== Home 화면 ===== */
#home {
  min-height: 100%;
  width: 100%; max-width: 440px; margin: 0 auto;
  display: flex; flex-direction: column; justify-content: center; gap: 14px;
  padding: max(20px, env(safe-area-inset-top)) 18px max(20px, env(safe-area-inset-bottom));
}
#home[hidden], #app[hidden] { display: none; }
.home-head { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
.brand.big { margin-right: auto; }
.brand.big .n1 { font-size: 13px; }
.brand.big .n2 { font-size: 29px; }

.levelcard {
  background: var(--ui-panel); border: 1px solid var(--ui-line);
  border-radius: 18px; padding: 16px 18px; box-shadow: var(--shadow);
}
.lvrow { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.lvrow .lv { font-size: 19px; font-weight: 800; }
.lvrow .pts { font-size: 14px; font-weight: 700; color: var(--accent); }
.bar {
  height: 8px; border-radius: 999px; background: var(--ui-panel-2);
  margin: 12px 0 8px; overflow: hidden;
}
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px;
         transition: width .45s ease; }
.next { font-size: 12px; color: var(--ui-dim); }
.coins {
  margin-top: 10px; font-size: 12px; font-weight: 700; color: var(--ui-text);
  background: var(--ui-panel-2); border: 1px solid var(--ui-line);
  border-radius: 999px; padding: 5px 11px; display: inline-block;
}

.menu { display: grid; gap: 10px; }
.mbtn {
  display: flex; align-items: center; gap: 12px;
  padding: 16px 18px; border-radius: 16px;
  background: var(--ui-panel); border: 1px solid var(--ui-line);
  color: var(--ui-text); text-align: left;
}
.mbtn[hidden] { display: none; }
.mbtn svg { width: 21px; height: 21px; flex: 0 0 21px; color: var(--accent); }
.mbtn .mlabel { font-size: 16px; font-weight: 700; }
.mbtn .msub { margin-left: auto; font-size: 12px; color: var(--ui-dim); text-align: right; }
.mbtn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.mbtn.primary svg { color: var(--accent-ink); }
.mbtn.primary .msub { color: var(--accent-ink); opacity: .8; }
.mbtn:active { transform: translateY(1px); }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }

/* ===== 데일리 달력 ===== */
.cal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.cal-head h2 { margin: 0; flex: 1; text-align: center; font-size: 17px; }
.cal-head .icon-btn { font-size: 20px; font-weight: 700; line-height: 1; }
.cal-dow, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.cal-dow span { text-align: center; font-size: 11px; color: var(--ui-dim); padding-bottom: 5px; }
.cal-cell {
  aspect-ratio: 1; border-radius: 11px; display: grid; place-items: center;
  font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums;
  background: var(--ui-panel-2); border: 1px solid transparent; color: var(--ui-text);
}
.cal-cell.blank { background: none; border: none; }
/* 내일 문제를 미리 풀 수는 없다 */
.cal-cell.future { opacity: .3; cursor: default; }
.cal-cell.done { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.cal-cell.today { border-color: var(--accent); }
.cal-foot { margin-top: 12px; font-size: 12px; color: var(--ui-dim); text-align: center; }

/* ===== 헤더 ===== */
header {
  width: calc(var(--cell) * 9 + 14px);
  max-width: 100%;
  display: flex;
  align-items: center;
  gap: 8px;
}
.brand {
  color: var(--ui-text); margin-right: auto;
  display: flex; align-items: center; gap: 8px;
  min-width: 0;
}
/* 이름의 앞뒤가 성격이 다르다 — 앞은 차분하게, 뒤는 굵고 강조색으로 친근하게.
   한 줄로 늘어놓으면 폰 너비에서 앞부분이 잘려 나가므로 두 줄로 쌓는다. */
.brand .name { display: flex; flex-direction: column; line-height: 1.08; }
.brand .n1 { font-size: 11px; font-weight: 600; color: var(--ui-dim); letter-spacing: .02em; }
.brand .n2 { font-size: 17px; font-weight: 800; color: var(--accent); letter-spacing: -.01em; }
header > .diff { margin-right: auto; }
.brand .diff {
  font-size: 11px; font-weight: 600; letter-spacing: .04em;
  color: var(--accent-ink); background: var(--accent);
  padding: 2px 8px; border-radius: 999px;
}
.timer {
  font-variant-numeric: tabular-nums;
  font-size: 15px; font-weight: 600; color: var(--ui-text);
  min-width: 56px; text-align: right;
}

/* ===== 버튼 공통 ===== */
button {
  font: inherit; color: inherit; cursor: pointer;
  background: none; border: none; padding: 0;
  -webkit-tap-highlight-color: transparent;
}
.icon-btn {
  width: 34px; height: 34px; border-radius: 11px;
  display: grid; place-items: center;
  background: var(--ui-panel); border: 1px solid var(--ui-line);
  color: var(--ui-text);
}
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn.lang { font-size: 12px; font-weight: 800; letter-spacing: .02em; }
/* 좁은 화면에서는 헤더 버튼 자리를 위해 앱 이름을 감춘다. 난이도 배지는 남긴다. */
/* 아주 좁은 화면에서는 버튼을 줄이고 이름의 앞부분을 접는다. */
@media (max-width: 360px) {
  header { gap: 6px; }
  .icon-btn { width: 30px; height: 30px; border-radius: 10px; }
  .brand .n1 { display: none; }
}
@media (hover: hover) {
  .icon-btn:hover { background: var(--ui-panel-2); }
}
.icon-btn:active { transform: translateY(1px); }
.icon-btn:disabled { opacity: .32; cursor: default; }

/* ===== 보드 ===== */
.board-card {
  position: relative;
  padding: 8px;
  border-radius: 16px;
  background: var(--card);
  border: 1px solid var(--card-edge);
  box-shadow: var(--shadow);
}
.board {
  display: grid;
  grid-template-columns: repeat(9, var(--cell));
  grid-template-rows: repeat(9, var(--cell));
  border: 2px solid var(--rule-bold);
  border-radius: 6px;
  overflow: hidden;
}
.cell {
  position: relative;
  background: transparent;
  display: grid; place-items: center;
  /* 고딕 숫자. 자간이 일정한 tabular 숫자를 써야 칸마다 흔들리지 않는다. */
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
  font-variant-numeric: tabular-nums;
  font-size: calc(var(--cell) * .52);
  font-weight: 500;
  line-height: 1;
  color: var(--ink-user);
  user-select: none;
  transition: background-color .12s ease;
  background-color: var(--cell-bg);
  /* 격자선은 칸이 각자 자기 오른쪽·아래 선을 그린다. gap 으로 그리면 이웃 칸의
     배경이 굵은 3×3 경계선을 덮어버린다. */
  border-right: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
}
/* 3×3 박스 경계는 굵은 잉크 선으로 */
.cell[data-c="2"], .cell[data-c="5"] { border-right: 2px solid var(--rule-bold); }
.cell[data-r="2"], .cell[data-r="5"] { border-bottom: 2px solid var(--rule-bold); }
/* 바깥 테두리는 .board 가 그리므로 마지막 줄은 자기 선을 지운다 */
.cell[data-c="8"] { border-right: none; }
.cell[data-r="8"] { border-bottom: none; }

.cell.given { color: var(--ink); font-weight: 700; }
.cell.err   { color: var(--ink-err); }

/* 강조는 겹쳐 쌓이므로 약한 것부터 선언한다 */
.cell.peer  { background-color: var(--cell-peer); }
.cell.same  { background-color: var(--cell-same); }
.cell.sel   { background-color: var(--cell-sel); }
/* 오류는 어떤 강조보다 뒤에 와야 가려지지 않는다 */
.cell.err     { background-color: var(--cell-err); }
.cell.err.sel { background-color: var(--cell-err-sel); }

/* 힌트 강조 — 선택·오류와 구별되도록 차가운 색 계열을 쓴다.
   어떤 강조보다 뒤에 와야 힌트를 보는 동안 가려지지 않는다. */
.cell.hl-unit   { background-color: var(--hl-unit); }
.cell.hl-mark   { background-color: var(--hl-mark); }
.cell.hl-target { background-color: var(--hl-target); box-shadow: inset 0 0 0 2px var(--hl-ring); }

.cell:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

/* 연필 메모 */
.notes {
  position: absolute; inset: 2px;
  display: grid;
  grid-template: repeat(3, 1fr) / repeat(3, 1fr);
  font-family: system-ui, sans-serif;
  font-size: calc(var(--cell) * .24);
  font-weight: 600;
  color: var(--ink-note);
  line-height: 1;
}
.notes span { display: grid; place-items: center; visibility: hidden; }
.notes span.on { visibility: visible; }

/* 일시정지 중에는 답이 보이지 않게 가린다.
   메모는 display 로 없앤다 — visibility 는 상속되므로 .notes 를 hidden 으로 해도
   자식 span 의 visibility:visible 이 이겨서 메모가 그대로 보인다. */
.board-card.masked .cell { color: transparent; }
.board-card.masked .notes { display: none; }

/* 힌트로 채운 칸은 잠깐 번쩍인다 */
@keyframes flash { 0%,100% { background-color: var(--cell-bg); } 40% { background-color: var(--flash); } }
.cell.flash { animation: flash .7s ease; }

/* 완료 연출 — 종이가 한 번 밝아진다 */
@keyframes solved-glow {
  0%   { box-shadow: var(--shadow); }
  45%  { box-shadow: var(--shadow), 0 0 0 4px var(--accent), 0 0 34px var(--accent); }
  100% { box-shadow: var(--shadow); }
}
.board-card.solved { animation: solved-glow 1.5s ease; }

@media (prefers-reduced-motion: reduce) {
  .cell, .board-card { transition: none !important; animation: none !important; }
}

/* ===== 도구 줄 (되돌리기·다시하기·지우개·메모·힌트) ===== */
.tools {
  width: calc(var(--cell) * 9 + 14px);
  max-width: 100%;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
}
.tool {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 8px 2px 7px;
  border-radius: 14px;
  background: var(--ui-panel);
  border: 1px solid var(--ui-line);
  color: var(--ui-text);
  font-size: 11px; letter-spacing: .02em;
}
.tool svg { width: 20px; height: 20px; }
.tool:active { transform: translateY(1px); }
.tool[disabled] { opacity: .38; cursor: default; }
.tool[aria-pressed="true"] {
  background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
}
/* 메모 모드일 때 몇 개 남았는지 같은 보조 표시 */
.tool .badge {
  position: absolute; transform: translate(16px, -8px);
  font-size: 10px; font-weight: 700;
  background: var(--ui-panel-2); color: var(--ui-text);
  border: 1px solid var(--ui-line); border-radius: 999px; padding: 0 5px;
}
.tool { position: relative; }

/* ===== 숫자 패드 ===== */
.pad {
  width: calc(var(--cell) * 9 + 14px);
  max-width: 100%;
  display: grid;
  grid-template-columns: repeat(9, 1fr);
  gap: 5px;
}
.num {
  position: relative;
  aspect-ratio: 1 / 1.2;
  border-radius: 14px;
  background: var(--ui-panel);
  border: 1px solid var(--ui-line);
  color: var(--ui-text);
  font-family: inherit;
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  font-size: clamp(17px, 4.8vw, 25px);
  display: grid; place-items: center;
}
.num:active { transform: translateY(1px); }
.num .left {
  position: absolute; bottom: 2px; right: 0; left: 0;
  font-family: system-ui, sans-serif;
  font-size: 9px; font-weight: 700; color: var(--ui-dim);
  text-align: center;
}
.num.done { opacity: .34; }

/* ===== 하단 줄 ===== */
.footer {
  width: calc(var(--cell) * 9 + 14px);
  max-width: 100%;
  display: flex; gap: 8px; align-items: center;
}
.btn {
  flex: 1;
  padding: 11px 12px; border-radius: 14px;
  background: var(--ui-panel); border: 1px solid var(--ui-line);
  color: var(--ui-text); font-size: 13px; font-weight: 600;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:active { transform: translateY(1px); }
.btn svg { width: 16px; height: 16px; }

/* ===== 힌트 바 =====
   전체 화면 오버레이로 하면 보드가 가려져 근거로 짚어 준 칸을 볼 수 없다.
   아래쪽에만 띄워 보드를 계속 보이게 한다. */
.hintbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
  background: var(--ui-panel);
  border-top: 1px solid var(--ui-line);
  box-shadow: 0 -12px 32px rgba(0,0,0,.4);
  padding: 14px 16px max(14px, env(safe-area-inset-bottom));
  display: flex; flex-direction: column; gap: 12px;
}
.hintbar[hidden] { display: none; }
.hintbar p { margin: 0; font-size: 14px; line-height: 1.62; color: var(--ui-text); }
.hint-actions { display: flex; gap: 8px; }
.hint-actions .btn { flex: 1; }
@media (min-width: 620px) {
  .hintbar {
    left: 50%; right: auto; transform: translateX(-50%);
    width: min(560px, 94vw);
    border: 1px solid var(--ui-line); border-bottom: none;
    border-radius: 16px 16px 0 0;
  }
}

/* ===== 오버레이 (일시정지 · 완료 · 통계 · 확인) ===== */
.overlay {
  position: fixed; inset: 0; z-index: 20;
  display: grid; place-items: center;
  padding: 16px;
  background: rgba(12,8,4,.62);
  backdrop-filter: blur(2px);
}
.overlay[hidden] { display: none; }
.sheet {
  width: min(360px, 100%);
  max-height: 86vh; overflow-y: auto;
  background: var(--ui-panel);
  border: 1px solid var(--ui-line);
  border-radius: 20px;
  box-shadow: var(--shadow);
  padding: 22px 20px 18px;
}
.sheet h2 {
  margin: 0 0 4px; font-size: 19px; letter-spacing: .02em;
}
.sheet p { margin: 0 0 14px; color: var(--ui-dim); font-size: 13px; line-height: 1.55; }
.sheet .row { display: flex; gap: 8px; margin-top: 14px; }
.sheet .row .btn { flex: 1; }

/* 난이도 선택 목록 */
.diff-list { display: grid; gap: 7px; }
.diff-item {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px; border-radius: 14px;
  background: var(--ui-panel-2); border: 1px solid var(--ui-line);
  color: var(--ui-text); font-size: 14px; font-weight: 600;
  width: 100%;
}
.diff-item .sub { margin-left: auto; font-size: 11px; font-weight: 500; color: var(--ui-dim); }
.diff-item[aria-current="true"] { border-color: var(--accent); }

/* 시작 옵션 스위치 */
.optrow {
  display: flex; align-items: center; gap: 12px; width: 100%;
  margin-top: 10px; padding: 12px 14px;
  border-radius: 14px; background: var(--ui-panel-2);
  border: 1px solid var(--ui-line); color: var(--ui-text); text-align: left;
}
.opt-text { display: flex; flex-direction: column; gap: 2px; margin-right: auto; }
.opt-label { font-size: 14px; font-weight: 700; }
.opt-sub { font-size: 11px; color: var(--ui-dim); line-height: 1.4; }
.switch {
  flex: 0 0 42px; width: 42px; height: 24px; border-radius: 999px;
  background: var(--ui-line); position: relative; transition: background-color .18s ease;
}
.switch i {
  position: absolute; top: 3px; left: 3px; width: 18px; height: 18px;
  border-radius: 50%; background: var(--ui-panel); transition: transform .18s ease;
}
.optrow[aria-pressed="true"] .switch { background: var(--accent); }
.optrow[aria-pressed="true"] .switch i { transform: translateX(18px); }
@media (prefers-reduced-motion: reduce) { .switch, .switch i { transition: none; } }

#settingList .optrow:first-child { margin-top: 0; }

/* 숫자 우선 모드에서 고른 숫자 */
.num.picked {
  background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
}
.num.picked .left { color: var(--accent-ink); opacity: .8; }

/* 도움말 */
ul.help { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; }
ul.help li { display: grid; gap: 3px; }
ul.help b { font-size: 14px; font-weight: 700; }
ul.help span { font-size: 12.5px; color: var(--ui-dim); line-height: 1.55; }

/* 결과 · 통계 표 */
.stats { width: 100%; border-collapse: collapse; font-size: 13px; }
.stats th, .stats td { padding: 7px 6px; text-align: right; }
.stats th:first-child, .stats td:first-child { text-align: left; }
.stats thead th { color: var(--ui-dim); font-weight: 600; font-size: 11px; letter-spacing: .04em; }
.stats tbody tr + tr td { border-top: 1px solid var(--ui-line); }
.stats td { font-variant-numeric: tabular-nums; }

.result-time {
  font-family: inherit; font-size: 36px; font-weight: 800; letter-spacing: -.01em;
  text-align: center; margin: 6px 0 2px; font-variant-numeric: tabular-nums;
}
.result-sub { text-align: center; color: var(--ui-dim); font-size: 12px; }
.result-score {
  text-align: center; margin: 10px 0 8px;
  font-size: 15px; font-weight: 800; color: var(--accent);
}
.record { text-align: center; color: var(--accent); font-size: 12px; font-weight: 700; }

/* 생성 중 표시 */
.spinner {
  width: 26px; height: 26px; margin: 8px auto 0;
  border: 3px solid var(--ui-line); border-top-color: var(--accent);
  border-radius: 50%; animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }

/* ===== 화면 크기 대응 =====
   보드가 화면을 넘지 않게 --cell 을 줄인다. 가로/세로 중 빡빡한 쪽 기준.
   세로: 화면 너비에서 좌우 여백 20px 을 빼고 9로 나눈다.
   높이: 헤더(44)+도구(58)+패드(60)+하단(46)+여백(50) = 약 258px 을 뺀다. */
@media (max-width: 460px), (max-height: 760px) {
  /* 100vw 에서 #app 좌우 여백 20px 과 종이의 안쪽 여백·테두리 14px 을 뺀 뒤 9로 나눈다.
     이걸 빼먹으면 보드가 화면 오른쪽으로 34px 넘쳐 힌트 버튼과 9 키가 잘린다. */
  :root { --cell: min(calc((100vw - 38px) / 9), calc((100vh - 262px) / 9), 44px); }
}
@media (min-width: 461px) and (min-height: 761px) {
  :root { --cell: min(46px, calc((100vh - 280px) / 9)); }
}
/* 가로로 넓은 태블릿: 보드를 키우고 패드를 옆에 둔다 */
@media (min-width: 820px) and (orientation: landscape) {
  :root { --cell: min(54px, calc((100vh - 120px) / 9)); }
  #app {
    display: grid;
    grid-template-columns: auto minmax(220px, 300px);
    grid-template-areas: "head head" "board side";
    align-content: center; justify-content: center;
    column-gap: 22px;
  }
  header { grid-area: head; width: 100%; max-width: 900px; }
  .board-card { grid-area: board; }
  .side { grid-area: side; display: flex; flex-direction: column; gap: 10px; justify-content: center; }
  .tools, .pad, .footer { width: 100%; }
  .pad { grid-template-columns: repeat(3, 1fr); gap: 8px; }
  /* 옆 칸은 폭이 넓어서 1:1.25 비율을 그대로 두면 키 하나가 120px 을 넘는다 */
  .num { aspect-ratio: auto; height: 60px; font-size: 22px; }
  #app > header { margin-top: 0; }
  .side > .footer { margin-bottom: 0; }
}
.side { display: contents; }
@media (min-width: 820px) and (orientation: landscape) { .side { display: flex; } }
</style>

<script>
"use strict";

/* =====================================================================
   1. 스도쿠 엔진
   난이도는 "주어진 숫자 개수"가 아니라 "푸는 데 필요한 기법"으로 정한다.
   개수만으로 나누면 같은 개수라도 체감 난이도가 크게 달라진다.
   ===================================================================== */

const ROWS = [], COLS = [], BOXES = [], PEERS = [], UNITS_OF = [];
for (let k = 0; k < 9; k++) { ROWS.push([]); COLS.push([]); BOXES.push([]); }
for (let i = 0; i < 81; i++) {
  const r = (i / 9) | 0, c = i % 9, b = ((r / 3) | 0) * 3 + ((c / 3) | 0);
  ROWS[r].push(i); COLS[c].push(i); BOXES[b].push(i);
}
const ALL_UNITS = [...ROWS, ...COLS, ...BOXES];
for (let i = 0; i < 81; i++) {
  const r = (i / 9) | 0, c = i % 9, b = ((r / 3) | 0) * 3 + ((c / 3) | 0);
  UNITS_OF.push([ROWS[r], COLS[c], BOXES[b]]);
  const s = new Set();
  for (const u of UNITS_OF[i]) for (const j of u) if (j !== i) s.add(j);
  PEERS.push([...s]);
}

const FULL = 0x1FF;                        // 후보 9개를 모두 켠 비트마스크
const bit = d => 1 << (d - 1);
function popcount(m) { let n = 0; while (m) { m &= m - 1; n++; } return n; }
function lowestDigit(m) { return 32 - Math.clz32(m & -m); }   // 가장 낮은 켜진 비트의 숫자

/* 퍼즐 생성에 쓰는 난수. 데일리 게임은 날짜를 씨앗으로 고정해서 어느 기기에서든
   같은 날 같은 문제가 나오게 한다 — 서버 없이 데일리를 돌리는 방법이다. */
let rnd = Math.random;

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** 문자열을 32비트 씨앗으로 (FNV-1a) */
function seedFrom(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = (rnd() * (i + 1)) | 0;
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/** 규칙을 지키며 완성된 보드 하나를 무작위로 만든다. */
function makeSolved() {
  const a = new Array(81).fill(0);
  (function fill(i) {
    if (i === 81) return true;
    let m = FULL;
    for (const j of PEERS[i]) if (a[j]) m &= ~bit(a[j]);
    const cands = shuffle(digitsOf(m));
    for (const d of cands) { a[i] = d; if (fill(i + 1)) return true; }
    a[i] = 0;
    return false;
  })(0);
  return a;
}

function digitsOf(mask) {
  const out = [];
  for (let d = 1; d <= 9; d++) if (mask & bit(d)) out.push(d);
  return out;
}

/**
 * 해의 개수를 센다. limit 에 도달하면 즉시 멈춘다 —
 * 유일해 판정에는 "2개째가 있는가"만 알면 되므로 전부 셀 필요가 없다.
 */
function countSolutions(grid, limit) {
  const a = grid.slice();
  let found = 0;

  function step() {
    // 후보가 가장 적은 칸부터 채운다(MRV). 가지치기가 훨씬 빨라진다.
    let best = -1, bestMask = 0, bestCount = 10;
    for (let i = 0; i < 81; i++) {
      if (a[i]) continue;
      let m = FULL;
      for (const j of PEERS[i]) if (a[j]) m &= ~bit(a[j]);
      const n = popcount(m);
      if (n === 0) return false;          // 막다른 길
      if (n < bestCount) { bestCount = n; best = i; bestMask = m; if (n === 1) break; }
    }
    if (best === -1) { found++; return found >= limit; }
    for (const d of digitsOf(bestMask)) {
      a[best] = d;
      if (step()) { a[best] = 0; return true; }
      a[best] = 0;
    }
    return false;
  }
  step();
  return found;
}

/* ---------- 논리 풀이 기법 ----------
   사람이 실제로 쓰는 기법만 단계적으로 적용해서, 어느 수준까지 동원해야
   풀리는지로 난이도를 매긴다. */

function makeCands(a) {
  const cd = new Array(81).fill(0);
  for (let i = 0; i < 81; i++) {
    if (a[i]) continue;
    let m = FULL;
    for (const j of PEERS[i]) if (a[j]) m &= ~bit(a[j]);
    cd[i] = m;
  }
  return cd;
}

function assign(a, cd, i, d) {
  a[i] = d; cd[i] = 0;
  for (const j of PEERS[i]) cd[j] &= ~bit(d);
}

/** 후보가 하나뿐인 칸 */
function nakedSingle(a, cd) {
  for (let i = 0; i < 81; i++) {
    if (!a[i] && popcount(cd[i]) === 1) { assign(a, cd, i, lowestDigit(cd[i])); return true; }
  }
  return false;
}

/** 한 단위 안에서 그 숫자가 들어갈 자리가 한 곳뿐 */
function hiddenSingle(a, cd) {
  for (const u of ALL_UNITS) {
    for (let d = 1; d <= 9; d++) {
      const b = bit(d);
      let spot = -1, n = 0, already = false;
      for (const i of u) {
        if (a[i] === d) { already = true; break; }
        if (!a[i] && (cd[i] & b)) { spot = i; n++; }
      }
      if (already || n !== 1) continue;
      assign(a, cd, spot, d);
      return true;
    }
  }
  return false;
}

/** 박스↔줄 사이의 겹침으로 후보를 지운다 (pointing / claiming) */
function lockedCandidates(a, cd) {
  let changed = false;
  for (let d = 1; d <= 9; d++) {
    const b = bit(d);
    // pointing: 박스 안의 d 후보가 한 줄에 몰려 있으면 그 줄의 박스 밖에서 d 를 지운다
    for (let bx = 0; bx < 9; bx++) {
      const spots = BOXES[bx].filter(i => !a[i] && (cd[i] & b));
      if (spots.length < 2) continue;
      const rs = new Set(spots.map(i => (i / 9) | 0));
      const cs = new Set(spots.map(i => i % 9));
      if (rs.size === 1) {
        for (const i of ROWS[[...rs][0]]) {
          if (!BOXES[bx].includes(i) && !a[i] && (cd[i] & b)) { cd[i] &= ~b; changed = true; }
        }
      }
      if (cs.size === 1) {
        for (const i of COLS[[...cs][0]]) {
          if (!BOXES[bx].includes(i) && !a[i] && (cd[i] & b)) { cd[i] &= ~b; changed = true; }
        }
      }
    }
    // claiming: 줄 안의 d 후보가 한 박스에 몰려 있으면 그 박스의 줄 밖에서 d 를 지운다
    for (const line of [...ROWS, ...COLS]) {
      const spots = line.filter(i => !a[i] && (cd[i] & b));
      if (spots.length < 2) continue;
      const bs = new Set(spots.map(i => (((i / 9) | 0) / 3 | 0) * 3 + ((i % 9) / 3 | 0)));
      if (bs.size !== 1) continue;
      for (const i of BOXES[[...bs][0]]) {
        if (!line.includes(i) && !a[i] && (cd[i] & b)) { cd[i] &= ~b; changed = true; }
      }
    }
  }
  return changed;
}

/** 같은 두 후보만 가진 칸이 한 단위에 둘 있으면 그 둘은 다른 칸에서 빠진다 */
function nakedPair(a, cd) {
  let changed = false;
  for (const u of ALL_UNITS) {
    const pairs = u.filter(i => !a[i] && popcount(cd[i]) === 2);
    for (let x = 0; x < pairs.length; x++) {
      for (let y = x + 1; y < pairs.length; y++) {
        if (cd[pairs[x]] !== cd[pairs[y]]) continue;
        const m = cd[pairs[x]];
        for (const i of u) {
          if (i === pairs[x] || i === pairs[y] || a[i]) continue;
          if (cd[i] & m) { cd[i] &= ~m; changed = true; }
        }
      }
    }
  }
  return changed;
}

/**
 * level 이하의 기법만으로 끝까지 풀리면 완성된 보드를, 아니면 null.
 *
 * 순서가 중요하다. 사람이 가장 먼저 쓰는 기법은 "이 박스에서 7이 들어갈 자리가
 * 한 곳뿐"인 숨은 홑수이지 후보를 8개 지워서 찾는 홑수가 아니다. 홑수를 1단계로
 * 두었더니 given 30개짜리를 "쉬움"으로 판정했다.
 */
function logicSolve(puzzle, level) {
  const a = puzzle.slice();
  const cd = makeCands(a);
  for (;;) {
    if (hiddenSingle(a, cd)) continue;
    if (level >= 2 && nakedSingle(a, cd)) continue;
    if (level >= 3 && (lockedCandidates(a, cd) || nakedPair(a, cd))) continue;
    break;
  }
  for (let i = 0; i < 81; i++) if (!a[i] && cd[i] === 0) return null;   // 모순
  return a.every(v => v) ? a : null;
}

/** 1=쉬움 2=보통 3=어려움 4=전문가(위 기법만으로는 안 풀림) */
function rate(puzzle) {
  for (let lv = 1; lv <= 3; lv++) if (logicSolve(puzzle, lv)) return lv;
  return 4;
}

/* ---------- 퍼즐 생성 ----------
   전략: 유일해를 유지하면서 지울 수 있는 만큼 지운 뒤(=대체로 전문가급),
   목표 난이도보다 어려우면 지웠던 칸을 하나씩 되돌려 난이도를 낮춘다.
   숫자를 되돌리는 것은 해를 늘리지 않으므로 유일해는 그대로 유지된다. */

const YIELD = () => new Promise(r => setTimeout(r, 0));

/* 난이도는 기법(rate)과 given 개수 둘 다로 정한다. 기법만 보면 given 30개짜리가
   "쉬움"이 되고, 개수만 보면 같은 개수라도 체감이 크게 달라진다. */
const GIVEN_FLOOR = { 1: 42, 2: 34, 3: 30, 4: 24 };
const GIVEN_CEIL  = { 1: 52, 2: 38, 3: 32, 4: 28 };
/* 기법 난이도의 하한. 상한(아래 제거 가드)만 두었더니 "전문가"인데 숨은 홑수만으로
   풀리는 퍼즐이 절반 가까이 나왔다 — 빈칸만 많고 논리적으로는 쉬운 문제다.
   1=숨은 홑수, 2=+홑수, 3=+줄박스 겹침·짝 후보, 4=그 이상. */
const RATE_MIN = { 1: 1, 2: 1, 3: 2, 4: 3 };

/**
 * 목표 난이도를 넘지 않는 선에서 지울 수 있는 만큼 지운다.
 *
 * 최대한 판 뒤에 숫자를 되돌려 난이도를 낮추는 방법도 써 봤지만, 난이도가 4에서
 * 3으로 떨어질 때까지 되돌리다 보면 given 이 40개를 넘어 "쉬움"과 구분되지
 * 않았다. 목표를 넘는 제거를 처음부터 하지 않으면 되돌릴 일 자체가 없다.
 */
async function generatePuzzle(level) {
  let fallback = null, fallbackScore = Infinity;

  for (let attempt = 0; attempt < 60; attempt++) {
    const solution = makeSolved();
    const puz = solution.slice();
    let givens = 81, ops = 0;

    for (const i of shuffle([...Array(81).keys()])) {
      if (givens <= GIVEN_FLOOR[level]) break;
      const partner = 80 - i;                       // 180도 회전 대칭으로 지운다
      const cells = partner === i ? [i] : [i, partner];
      const saved = cells.filter(k => puz[k]).map(k => [k, puz[k]]);
      if (!saved.length) continue;

      for (const [k] of saved) puz[k] = 0;
      // 해가 갈라지거나 목표보다 어려워지면 그 칸은 남겨 둔다
      if (countSolutions(puz, 2) !== 1 || rate(puz) > level) {
        for (const [k, v] of saved) puz[k] = v;
      } else {
        givens -= saved.length;
      }
      if ((++ops & 7) === 0) await YIELD();
    }

    // 위 가드가 rate > level 인 제거를 막았으므로 난이도는 이미 상한 안에 있다.
    // 남은 판정은 빈칸을 목표만큼 팠는가와, 기법 난이도가 하한에 닿았는가다.
    const lv = rate(puz);
    if (givens <= GIVEN_CEIL[level] && lv >= RATE_MIN[level]) return { puzzle: puz, solution };
    // 조건에 못 미쳐도 유일해는 보장된 정상 퍼즐이다. 가장 가까운 것을 남긴다.
    const score = (givens <= GIVEN_CEIL[level] ? 0 : givens - GIVEN_CEIL[level])
                + Math.max(0, RATE_MIN[level] - lv) * 3;
    if (!fallback || score < fallbackScore) {
      fallback = { puzzle: puz.slice(), solution };
      fallbackScore = score;
    }
    await YIELD();
  }
  return fallback;
}

let LANG = "ko";
const L = () => I18N[LANG];

const DIFFS = [
  { key: "easy",   level: 1, blanks: 39 },
  { key: "normal", level: 2, blanks: 47 },
  { key: "hard",   level: 3, blanks: 51 },
  { key: "expert", level: 4, blanks: 55 },
];
const diffName = key => L().diffNames[key];
const diffOf = key => DIFFS.find(d => d.key === key) || DIFFS[1];
const isDiffKey = key => DIFFS.some(d => d.key === key);

const KEY_GAME = "sudoku.game.v1";
const KEY_STATS = "sudoku.stats.v1";
const KEY_THEME = "sudoku.theme.v1";
const KEY_LANG = "sudoku.lang.v1";
const KEY_DAILY = "sudoku.daily.v1";

/* 요일마다 난이도를 돌린다. 매일 같은 난이도면 금방 질리고, 무작위면 오늘이 어떤
   날인지 예상할 수 없다. 일요일은 가볍게, 토요일은 무겁게. */
const DAILY_DIFF = ["easy", "normal", "normal", "hard", "normal", "hard", "expert"];

const pad2 = n => String(n).padStart(2, "0");
const dateKey = d => d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
const parseKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const todayKey = () => dateKey(new Date());
const dailyDiff = key => DAILY_DIFF[parseKey(key).getDay()];

function dailyRecords() {
  const r = load(KEY_DAILY);
  return r && typeof r === "object" ? r : {};
}
function markDaily(key, ms, hints, score) {
  const r = dailyRecords();
  // 같은 날을 다시 풀면 더 좋은 기록만 남긴다
  if (!r[key] || ms < r[key].ms) r[key] = { ms, hints, score };
  store(KEY_DAILY, r);
}

/** 그 날짜의 퍼즐. 씨앗이 같으므로 언제 어디서 만들어도 같은 문제가 나온다. */
async function generateDaily(key) {
  const prev = rnd;
  rnd = mulberry32(seedFrom("dokudoku:" + key));
  try {
    return await generatePuzzle(diffOf(dailyDiff(key)).level);
  } finally {
    rnd = prev;
  }
}

/* localStorage 는 file:// 이나 시크릿 모드에서 막힐 수 있다.
   막혀도 게임은 그대로 돌아가야 하므로 전부 감싼다. */
function store(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* 저장 못 해도 진행 */ }
}
function load(key) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function drop(key) {
  try { localStorage.removeItem(key); } catch (e) { /* 무시 */ }
}

let S = null;          // 현재 게임
let genBusy = false;   // 생성 중 중복 실행 방지

function newState(diffKey, puzzle, solution, dailyKey) {
  return {
    diff: diffKey,
    daily: dailyKey || null,      // 데일리로 시작했으면 그 날짜 키
    puzzle,                        // 문제 (0 = 빈칸). given 판정에 쓴다
    solution,
    grid: puzzle.slice(),          // 현재 보드
    notes: new Array(81).fill(0),  // 칸별 후보 비트마스크
    selected: -1,
    notesMode: false,
    hints: 0,
    undos: 0,
    elapsed: 0,                    // 누적 밀리초
    history: [],
    future: [],
    done: false,
  };
}

function saveGame() {
  // 진행 중인 게임이 없을 때 호출되는 것은 정상이다(예: Home 으로 나갈 때).
  // 그때 저장본을 지우면 앱을 켜자마자 이어하기가 사라진다. 끝난 게임만 지운다.
  if (!S) return;
  if (S.done) { drop(KEY_GAME); return; }
  store(KEY_GAME, {
    diff: S.diff, daily: S.daily, puzzle: S.puzzle, solution: S.solution, grid: S.grid,
    notes: S.notes, hints: S.hints, undos: S.undos, elapsed: elapsedMs(),
    history: S.history, future: S.future,
  });
}

/** 81칸짜리 숫자 배열인지 확인한다. 하나라도 어긋나면 쓰지 않는다. */
function isBoard(a) {
  return Array.isArray(a) && a.length === 81 &&
         a.every(v => Number.isInteger(v) && v >= 0 && v <= 9);
}

function restoreGame() {
  const g = load(KEY_GAME);
  // grid 만 검사하면 puzzle/solution 이 깨진 저장본에서 updateView 가 예외로 죽고,
  // 깨진 데이터가 그대로 남아 다시 켜도 계속 죽는다. 셋 다 확인하고, 이상하면 버린다.
  if (!g || !isBoard(g.grid) || !isBoard(g.puzzle) || !isBoard(g.solution) ||
      !isDiffKey(g.diff) || g.solution.some(v => v === 0)) {
    drop(KEY_GAME);
    return null;
  }
  const s = newState(g.diff, g.puzzle, g.solution,
                     typeof g.daily === "string" ? g.daily : null);
  s.grid = g.grid;
  s.notes = Array.isArray(g.notes) && g.notes.length === 81
          ? g.notes.map(n => (Number.isInteger(n) && n >= 0 ? n & FULL : 0))
          : s.notes;
  s.hints = g.hints | 0;
  s.undos = g.undos | 0;
  s.elapsed = g.elapsed | 0;
  s.history = Array.isArray(g.history) ? g.history : [];
  s.future = Array.isArray(g.future) ? g.future : [];
  return s;
}

/* ---------- 점수와 레벨 ----------
   난이도가 기본값을 정하고, 빨리 풀면 올리고 힌트를 쓰면 깎는다.
   데일리는 하루 한 번뿐이라 가산한다. */
const SCORE_BASE = { easy: 100, normal: 220, hard: 400, expert: 700 };
/* 기준 시간. 이보다 빠르면 가산, 느리면 감산한다. */
const PAR_MS = { easy: 6 * 60000, normal: 12 * 60000, hard: 20 * 60000, expert: 35 * 60000 };

function scoreFor(diffKey, ms, hints, isDaily) {
  const base = SCORE_BASE[diffKey] || SCORE_BASE.normal;
  const par = PAR_MS[diffKey] || PAR_MS.normal;
  // 기준의 절반이면 1.5배, 두 배 걸리면 0.6배. 양끝을 막아 과하게 벌어지지 않게 한다.
  const speed = Math.max(0.6, Math.min(1.6, 2 - ms / par));
  // 힌트는 하나당 12% 깎되 절반까지만 — 다 깎으면 힌트를 쓰느니 포기하게 된다.
  const hintMul = Math.max(0.5, 1 - (hints | 0) * 0.12);
  return Math.max(10, Math.round(base * speed * hintMul * (isDaily ? 1.5 : 1)));
}

/** 누적 점수로 레벨을 낸다. 레벨이 오를수록 다음 레벨까지 250점씩 더 든다. */
function levelOf(score) {
  let level = 1, need = 500, acc = 0;
  while (score >= acc + need) { acc += need; level++; need += 250; }
  return { level, into: score - acc, need };
}

/* ---------- 통계 ---------- */
function blankStats() {
  const byDiff = {};
  for (const d of DIFFS) byDiff[d.key] = { count: 0, bestMs: 0, totalMs: 0 };
  return { streak: 0, bestStreak: 0, score: 0, byDiff };
}

function getStats() {
  const raw = load(KEY_STATS);
  const s = blankStats();
  if (!raw || typeof raw !== "object") return s;
  s.streak = raw.streak | 0;
  s.bestStreak = raw.bestStreak | 0;
  s.score = Math.max(0, raw.score | 0);
  for (const d of DIFFS) {
    const r = raw.byDiff && raw.byDiff[d.key];
    if (r) s.byDiff[d.key] = { count: r.count | 0, bestMs: r.bestMs | 0, totalMs: r.totalMs | 0 };
  }
  return s;
}

/** 완료를 기록하고 얻은 점수·최고기록·레벨업 여부를 돌려준다. */
function recordWin(diffKey, ms, hints, isDaily) {
  const s = getStats();
  const d = s.byDiff[diffKey] || (s.byDiff[diffKey] = { count: 0, bestMs: 0, totalMs: 0 });
  const isBest = d.count === 0 || ms < d.bestMs;
  d.count++;
  d.totalMs += ms;
  if (isBest) d.bestMs = ms;
  s.streak++;
  if (s.streak > s.bestStreak) s.bestStreak = s.streak;

  const before = levelOf(s.score).level;
  const score = scoreFor(diffKey, ms, hints, isDaily);
  s.score += score;
  const after = levelOf(s.score).level;

  store(KEY_STATS, s);
  return { isBest, score, leveledUp: after > before, level: after };
}

/* =====================================================================
   3. 화면
   상태가 바뀔 때 DOM 을 다시 만들지 않는다. 칸 요소는 한 번만 만들고
   클래스와 글자만 바꾼다 — 그래야 전이·애니메이션이 매번 리셋되지 않는다.
   ===================================================================== */

const $ = id => document.getElementById(id);
const boardEl = $("board"), padEl = $("pad"), cardEl = $("boardCard");
const cellEls = [], valEls = [], noteEls = [], numEls = [];

function buildBoard() {
  const frag = document.createDocumentFragment();
  for (let i = 0; i < 81; i++) {
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.dataset.r = (i / 9) | 0;
    cell.dataset.c = i % 9;
    cell.dataset.i = i;
    cell.setAttribute("role", "gridcell");
    cell.setAttribute("aria-rowindex", String(((i / 9) | 0) + 1));
    cell.setAttribute("aria-colindex", String((i % 9) + 1));
    // 81개가 모두 탭 순서에 들어가면 키보드로 지나가기 힘들다.
    // 고른 칸 하나만 0 으로 두고 나머지는 -1 로 둔다(roving tabindex).
    cell.tabIndex = -1;

    const notes = document.createElement("div");
    notes.className = "notes";
    const spans = [];
    for (let d = 1; d <= 9; d++) {
      const sp = document.createElement("span");
      sp.textContent = d;
      notes.appendChild(sp);
      spans.push(sp);
    }
    const val = document.createElement("span");
    val.className = "val";

    cell.append(notes, val);
    frag.appendChild(cell);
    cellEls.push(cell); valEls.push(val); noteEls.push(spans);
  }
  boardEl.appendChild(frag);
}

function buildPad() {
  for (let d = 1; d <= 9; d++) {
    const btn = document.createElement("button");
    btn.className = "num";
    btn.dataset.d = d;
    btn.setAttribute("aria-label", L().padEnter(d));
    const face = document.createElement("span");
    face.textContent = d;
    const left = document.createElement("span");
    left.className = "left";
    btn.append(face, left);
    padEl.appendChild(btn);
    numEls.push({ btn, left });
  }
}

/** 규칙을 어긴 칸들 */
function conflicts(grid) {
  const bad = new Set();
  for (const u of ALL_UNITS) {
    const seen = new Map();
    for (const i of u) {
      const v = grid[i];
      if (!v) continue;
      if (seen.has(v)) { bad.add(i); bad.add(seen.get(v)); }
      else seen.set(v, i);
    }
  }
  return bad;
}

function updateView() {
  if (!S) return;
  const bad = settings.showErrors ? conflicts(S.grid) : new Set();
  const hlUnit = hint ? new Set(hint.unit) : null;
  const hlMark = hint ? new Set(hint.marks) : null;
  const hlCell = hint ? hint.cell : -1;
  const sel = S.selected;
  // 숫자 우선 모드에서는 고른 숫자를 기준으로 강조한다
  const selVal = (settings.numberFirst && padSel) ? padSel : (sel >= 0 ? S.grid[sel] : 0);
  const peers = sel >= 0 ? new Set(PEERS[sel]) : null;

  for (let i = 0; i < 81; i++) {
    const el = cellEls[i], v = S.grid[i];
    valEls[i].textContent = v || "";
    el.classList.toggle("given", S.puzzle[i] !== 0);
    el.classList.toggle("err", bad.has(i));
    el.classList.toggle("sel", i === sel);
    el.classList.toggle("peer", !!peers && peers.has(i));
    el.classList.toggle("same", !!selVal && v === selVal && i !== sel);
    el.classList.toggle("hl-unit", !!hlUnit && hlUnit.has(i) && i !== hlCell);
    el.classList.toggle("hl-mark", !!hlMark && hlMark.has(i));
    el.classList.toggle("hl-target", i === hlCell);
    const nm = v ? 0 : S.notes[i];
    const spans = noteEls[i];
    for (let k = 0; k < 9; k++) spans[k].classList.toggle("on", (nm & (1 << k)) !== 0);

    // 화면을 못 보는 사람에게도 위치와 값이 읽히게 한다
    el.setAttribute("aria-label", L().cellLabel((i / 9 | 0) + 1, (i % 9) + 1, v));
    el.setAttribute("aria-selected", String(i === sel));
    if (S.puzzle[i]) el.setAttribute("aria-readonly", "true");
    el.tabIndex = i === sel ? 0 : -1;
  }

  // 숫자별 남은 개수
  const counts = new Array(10).fill(0);
  for (const v of S.grid) if (v) counts[v]++;
  for (let d = 1; d <= 9; d++) {
    const left = 9 - counts[d];
    numEls[d - 1].left.textContent = left > 0 ? left : "";
    numEls[d - 1].btn.classList.toggle("done", left <= 0);
    numEls[d - 1].btn.classList.toggle("picked", settings.numberFirst && padSel === d);
  }

  const coins = getCoins();
  $("hintCoins").textContent = coins;
  $("btnHint").disabled = coins < HINT_COST;
  $("btnUndo").disabled = S.history.length === 0;
  $("btnRedo").disabled = S.future.length === 0;
  $("btnNotes").setAttribute("aria-pressed", String(S.notesMode));
  $("diffBadge").textContent = diffName(S.diff);
}

/* ---------- 시간 ---------- */
let tStart = 0, tRunning = false;

function elapsedMs() { return (S ? S.elapsed : 0) + (tRunning ? Date.now() - tStart : 0); }
function startTimer() { if (tRunning || !S || S.done) return; tStart = Date.now(); tRunning = true; }
function stopTimer() { if (!tRunning) return; S.elapsed += Date.now() - tStart; tRunning = false; }

function fmt(ms) {
  const t = Math.max(0, Math.floor(ms / 1000));
  const h = (t / 3600) | 0, m = ((t % 3600) / 60) | 0, s = t % 60;
  const mm = h ? String(m).padStart(2, "0") : String(m);
  return (h ? h + ":" : "") + mm + ":" + String(s).padStart(2, "0");
}
function paintTimer() { $("timer").textContent = fmt(elapsedMs()); }

/* =====================================================================
   4. 조작
   ===================================================================== */

// 터치 기기에서의 짧은 진동 피드백 (지원하지 않으면 조용히 무시된다)
function buzz(ms) {
  if (!settings.haptics) return;
  try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* 무시 */ }
}

/** 여러 칸 변경을 한 덩어리로 적용한다. 되돌리기는 이 덩어리 단위로 움직인다. */
function commit(changes) {
  const entry = [];
  for (const c of changes) {
    const before = { v: S.grid[c.i], n: S.notes[c.i] };
    if (before.v === c.v && before.n === c.n) continue;
    entry.push({ i: c.i, before, after: { v: c.v, n: c.n } });
  }
  if (!entry.length) return false;
  for (const e of entry) { S.grid[e.i] = e.after.v; S.notes[e.i] = e.after.n; }
  S.history.push(entry);
  S.future.length = 0;
  return true;
}

function undo() {
  const e = S.history.pop();
  if (!e) return;
  for (const c of e) { S.grid[c.i] = c.before.v; S.notes[c.i] = c.before.n; }
  S.future.push(e);
  S.undos++;
  buzz(6);
  afterChange();
}

function redo() {
  const e = S.future.pop();
  if (!e) return;
  for (const c of e) { S.grid[c.i] = c.after.v; S.notes[c.i] = c.after.n; }
  S.history.push(e);
  buzz(6);
  afterChange();
}

/** 확정 숫자를 넣으면 같은 행·열·박스의 그 후보 메모를 지운다 */
function peerNoteClears(i, d) {
  const out = [];
  for (const j of PEERS[i]) {
    if (S.grid[j] || !(S.notes[j] & bit(d))) continue;
    out.push({ i: j, v: 0, n: S.notes[j] & ~bit(d) });
  }
  return out;
}

let padSel = 0;        // 숫자 우선 모드에서 고른 숫자 (0 = 없음)

function inputDigit(d) { placeDigit(S ? S.selected : -1, d); }

function placeDigit(i, d) {
  if (!S || S.done) return;
  dismissHint();
  if (i < 0 || S.puzzle[i]) return;

  let changes;
  if (S.notesMode) {
    if (S.grid[i]) return;                       // 확정 숫자가 있는 칸에는 메모하지 않는다
    changes = [{ i, v: 0, n: S.notes[i] ^ bit(d) }];
  } else if (S.grid[i] === d) {
    changes = [{ i, v: 0, n: S.notes[i] }];      // 같은 숫자를 다시 누르면 지운다
  } else {
    changes = [{ i, v: d, n: 0 }, ...peerNoteClears(i, d)];
  }
  if (commit(changes)) { startTimer(); buzz(10); }
  afterChange();
}

function eraseCell() {
  if (!S || S.done) return;
  dismissHint();
  const i = S.selected;
  if (i < 0 || S.puzzle[i]) return;
  if (commit([{ i, v: 0, n: 0 }])) buzz(8);
  afterChange();
}

let hint = null;          // 지금 보여 주고 있는 힌트

/** 다음 한 수와 그 근거를 아래쪽 바에 띄운다. 숫자는 사용자가 "적용"을 눌러야 들어간다. */
/** 화면 밖으로 읽히는 안내. 시각 정보만으로는 전달되지 않는 변화에 쓴다. */
function announce(text) { $("live").textContent = text; }

function showHint() {
  if (!S || S.done) return;

  // 설명 자체가 답을 드러내므로(어느 칸인지 짚어 준다) 볼 때 값을 치른다.
  if (!spendCoins(HINT_COST)) {
    hint = null;
    $("hintText").textContent = L().noCoins;
    announce(L().noCoins);
    $("btnHintApply").hidden = true;
    $("hintBar").hidden = false;
    updateView();
    return;
  }

  const h = findHint(S);
  if (!h) { addCoins(HINT_COST); return; }   // 채울 칸이 없으면 돌려준다
  hint = h;
  $("btnHintApply").hidden = false;
  S.selected = -1;          // 선택 강조와 겹치면 어느 칸이 근거인지 헷갈린다

  const T = L();
  const text =
      h.kind === "wrong"        ? T.hintWrong(h.digit)
    : h.kind === "nakedSingle"  ? T.hintNaked(h.digit)
    : h.kind === "reveal"       ? T.hintReveal(h.digit)
    : h.unitKind === "box"      ? T.hintHiddenBox(h.digit)
    : h.unitKind === "row"      ? T.hintHiddenRow(h.digit)
    :                             T.hintHiddenCol(h.digit);

  $("hintText").textContent = text + " " + T.coinsLeft(getCoins());
  announce(text);
  $("btnHintApply").textContent = h.kind === "wrong" ? T.hintErase : T.hintApply;
  $("hintBar").hidden = false;
  startTimer();
  updateView();
}

function dismissHint() {
  // 코인이 모자라 안내만 띄운 경우에도 바를 닫아야 하므로 hint 유무로 가르지 않는다.
  if (hint === null && $("hintBar").hidden) return;
  hint = null;
  $("hintBar").hidden = true;
  updateView();
}

function applyHint() {
  if (!hint || !S) return;
  const h = hint;
  dismissHint();

  if (h.kind === "wrong") {
    commit([{ i: h.cell, v: 0, n: S.notes[h.cell] }]);
  } else {
    // 틀린 숫자를 지우는 것은 도움을 받은 것이 아니므로 세지 않는다.
    if (commit([{ i: h.cell, v: h.digit, n: 0 }, ...peerNoteClears(h.cell, h.digit)])) S.hints++;
  }
  S.selected = h.cell;
  buzz(16);
  const el = cellEls[h.cell];
  el.classList.remove("flash");
  void el.offsetWidth;               // 애니메이션을 다시 트리거하기 위한 강제 리플로
  el.classList.add("flash");
  afterChange();
}

/* ---------- 힌트 ----------
   답만 알려 주면 배우는 것이 없다. 어떤 근거로 그 숫자가 되는지 설명하고,
   근거가 되는 칸을 보드에서 함께 짚어 준다. */

/** 한국어 조사 — 숫자의 받침 유무로 갈린다 (1 일, 3 삼, 6 육, 7 칠, 8 팔 은 받침 있음) */
const KO_JONG = { 1: true, 2: false, 3: true, 4: false, 5: false,
                  6: true, 7: true, 8: true, 9: false };
const koIga = d => d + (KO_JONG[d] ? "이" : "가");
const koEul = d => d + (KO_JONG[d] ? "을" : "를");

/**
 * 지금 보드에서 다음 한 수를 찾고 그 근거를 함께 돌려준다.
 * 사람이 실제로 쓰는 순서를 따른다 — 틀린 숫자 → 숨은 홑수 → 홑수 → (그 외는 공개).
 */
function findHint(st) {
  // 1) 틀린 숫자가 있으면 그것부터. 잘못 놓인 채로는 어떤 추론도 소용없다.
  for (let i = 0; i < 81; i++) {
    if (!st.puzzle[i] && st.grid[i] && st.grid[i] !== st.solution[i]) {
      return { kind: "wrong", cell: i, digit: st.grid[i], marks: [], unit: [] };
    }
  }

  const a = st.grid.slice();
  const cd = makeCands(a);

  // 2) 숨은 홑수 — 박스가 눈에 가장 잘 띄므로 박스부터 본다.
  for (const [kind, units] of [["box", BOXES], ["row", ROWS], ["col", COLS]]) {
    for (const u of units) {
      for (let d = 1; d <= 9; d++) {
        if (u.some(i => a[i] === d)) continue;
        const spots = u.filter(i => !a[i] && (cd[i] & bit(d)));
        if (spots.length !== 1) continue;
        // 나머지 빈칸이 왜 안 되는지 — 그 칸을 막고 있는 같은 숫자의 자리
        const marks = [];
        for (const i of u) {
          if (a[i] || i === spots[0]) continue;
          const blocker = PEERS[i].find(j => a[j] === d);
          if (blocker !== undefined) marks.push(blocker);
        }
        return { kind: "hiddenSingle", cell: spots[0], digit: d, unitKind: kind,
                 unit: u, marks: [...new Set(marks)] };
      }
    }
  }

  // 3) 홑수 — 그 칸에 남은 후보가 하나뿐
  for (let i = 0; i < 81; i++) {
    if (a[i] || popcount(cd[i]) !== 1) continue;
    const d = lowestDigit(cd[i]);
    // 근거는 "나머지 여덟 숫자가 이미 이웃에 있다" 이므로 숫자마다 한 칸씩만 짚는다
    const marks = [];
    for (let other = 1; other <= 9; other++) {
      if (other === d) continue;
      const j = PEERS[i].find(k => a[k] === other);
      if (j !== undefined) marks.push(j);
    }
    return { kind: "nakedSingle", cell: i, digit: d, marks, unit: [] };
  }

  // 4) 한 칸만 보고 정할 수 있는 수가 없다 — 더 앞선 기법이 필요한 자리다.
  const empties = [];
  for (let i = 0; i < 81; i++) if (!a[i]) empties.push(i);
  if (!empties.length) return null;
  const cell = empties[(Math.random() * empties.length) | 0];
  return { kind: "reveal", cell, digit: st.solution[cell], marks: [], unit: [] };
}

function select(i) {
  if (!S || S.done) return;
  dismissHint();
  S.selected = i;
  updateView();
}

function moveSelection(dr, dc) {
  if (!S || S.done) return;
  const cur = S.selected < 0 ? 0 : S.selected;
  const r = Math.min(8, Math.max(0, ((cur / 9) | 0) + dr));
  const c = Math.min(8, Math.max(0, (cur % 9) + dc));
  select(r * 9 + c);
}

/** 변경 뒤 공통 처리 — 화면 갱신, 완료 판정, 저장 */
function afterChange() {
  updateView();
  if (!S.done && S.grid.every(v => v) && conflicts(S.grid).size === 0) finish();
  else saveGame();
}

function finish() {
  stopTimer();
  S.done = true;
  S.selected = -1;
  const ms = S.elapsed;
  drop(KEY_GAME);
  const res = recordWin(S.diff, ms, S.hints, !!S.daily);
  if (S.daily) markDaily(S.daily, ms, S.hints, res.score);
  addCoins(WIN_REWARD);
  updateView();
  cardEl.classList.remove("solved");
  void cardEl.offsetWidth;
  cardEl.classList.add("solved");
  buzz([14, 70, 14]);

  $("resTime").textContent = fmt(ms);
  const bits = [diffName(S.diff)];
  if (S.hints) bits.push(L().hintsUsed(S.hints));
  if (S.undos) bits.push(L().undosUsed(S.undos));
  if (S.daily) bits.push(L().dailyTag);
  $("resSub").textContent = bits.join(" · ");
  $("resScore").textContent = L().gained(res.score) + " · " + L().coinReward(WIN_REWARD);
  announce(L().resultTitle + " " + fmt(ms) + " " + L().gained(res.score));
  $("resRecord").hidden = !res.isBest && !res.leveledUp;
  $("resRecord").textContent = res.leveledUp ? L().leveledUp(res.level) : L().record;
  openOverlay("ovResult");
}

/* ---------- 설정 ---------- */
const KEY_SETTINGS = "sudoku.settings.v1";
const SETTING_DEFAULTS = {
  numberFirst: false,   // 숫자를 먼저 고르고 칸을 눌러 채운다
  haptics: true,        // 진동 피드백
  showErrors: true,     // 규칙을 어긴 숫자를 표시
  showTimer: true,      // 경과 시간 표시
};
let settings = { ...SETTING_DEFAULTS };

function loadSettings() {
  const raw = load(KEY_SETTINGS);
  settings = { ...SETTING_DEFAULTS };
  if (raw && typeof raw === "object") {
    for (const k of Object.keys(SETTING_DEFAULTS)) {
      if (typeof raw[k] === "boolean") settings[k] = raw[k];
    }
  }
  return settings;
}
function setSetting(k, v) {
  settings[k] = !!v;
  store(KEY_SETTINGS, settings);
}

/* ---------- 코인 ----------
   힌트는 공짜가 아니다. 게임을 끝내면 하나씩 벌고, 힌트를 볼 때 하나 쓴다.
   기록을 따로 두는 이유: "기록 지우기"로 통계를 비워도 코인은 남아야 한다.

   INITIAL_COINS 는 지금 기능 시험용으로 999 다. 출시 전에 실제 시작값으로 낮춘다. */
const KEY_COINS = "sudoku.coins.v1";
const INITIAL_COINS = 999;
const HINT_COST = 1;
const WIN_REWARD = 1;

function getCoins() {
  const v = load(KEY_COINS);
  return Number.isInteger(v) && v >= 0 ? v : INITIAL_COINS;
}
function setCoins(n) { store(KEY_COINS, Math.max(0, n | 0)); }
function addCoins(n) { setCoins(getCoins() + n); return getCoins(); }
/** 쓸 수 있으면 깎고 true, 모자라면 그대로 두고 false. */
function spendCoins(n) {
  const c = getCoins();
  if (c < n) return false;
  setCoins(c - n);
  return true;
}

/* ---------- 자동 노트 ----------
   빈칸마다 규칙상 들어갈 수 있는 숫자를 미리 적어 둔다. 후보를 손으로 옮겨 적는
   지루한 부분을 건너뛰게 해 준다. */
const KEY_AUTONOTE = "sudoku.autonote.v1";
const autoNotesOn = () => load(KEY_AUTONOTE) === true;

function computeAutoNotes(st) {
  const notes = new Array(81).fill(0);
  for (let i = 0; i < 81; i++) {
    if (st.puzzle[i] || st.grid[i]) continue;
    let m = FULL;
    for (const j of PEERS[i]) if (st.grid[j]) m &= ~bit(st.grid[j]);
    notes[i] = m;
  }
  return notes;
}

/* ---------- 설정 시트 ---------- */
const SETTING_ROWS = [
  { key: "numberFirst", i18n: "setNumberFirst" },

  { key: "showErrors",  i18n: "setShowErrors" },

}

/* ---------- 데일리 달력 ---------- */
let calMonth = null;

function openDaily() {
  const now = new Date();
  calMonth = { y: now.getFullYear(), m: now.getMonth() + 1 };
  renderCalendar();
  openOverlay("ovDaily");
}

function shiftMonth(delta) {
  let { y, m } = calMonth;
  m += delta;
  if (m < 1) { m = 12; y--; } else if (m > 12) { m = 1; y++; }
  calMonth = { y, m };
  renderCalendar();
}

function renderCalendar() {
  const { y, m } = calMonth;
  $("calTitle").textContent = L().calTitle(y, m);

  const dow = $("calDow");
  dow.textContent = "";
  for (const d of L().dows) {
    const sp = document.createElement("span");
    sp.textContent = d;
    dow.appendChild(sp);
  }

  const grid = $("calGrid");
  grid.textContent = "";
  const firstDow = new Date(y, m - 1, 1).getDay();
  const days = new Date(y, m, 0).getDate();     // 0일 = 지난달 마지막 날
  const recs = dailyRecords();
  const tk = todayKey();
  let done = 0;

  for (let i = 0; i < firstDow; i++) {
    const b = document.createElement("div");
    b.className = "cal-cell blank";
    grid.appendChild(b);
  }
  for (let d = 1; d <= days; d++) {
    const key = y + "-" + pad2(m) + "-" + pad2(d);
    const el = document.createElement("button");
    el.className = "cal-cell";
    el.textContent = d;
    el.dataset.key = key;
    if (recs[key]) { el.classList.add("done"); done++; }
    if (key === tk) el.classList.add("today");
    // 내일 문제를 미리 풀 수는 없다. ISO 형식이라 문자열 비교로 충분하다.
    if (key > tk) { el.classList.add("future"); el.disabled = true; }
    grid.appendChild(el);
  }
  $("calFoot").textContent = L().monthDone(done, days);
  $("calNext").disabled = (y + "-" + pad2(m)) >= tk.slice(0, 7);
}

async function startDaily(key) {
  if (genBusy) return;
  genBusy = true;
  closeOverlay();
  showGame();
  hint = null;
  $("hintBar").hidden = true;
  cardEl.classList.remove("masked", "solved");
  openOverlay("ovGen");
  await YIELD();
  const made = await generateDaily(key);
  genBusy = false;
  if (!made) { closeOverlay(); showHome(); return; }
  S = newState(dailyDiff(key), made.puzzle, made.solution, key);
  if (autoNotesOn()) S.notes = computeAutoNotes(S);
  padSel = 0;
  tRunning = false;
  closeOverlay();
  updateView();
  paintTimer();
  startTimer();
  saveGame();
}
function openOverlay(id) { dismissHint(); closeOverlay(); overlayOpen = id; $(id).hidden = false; }
function closeOverlay() { if (overlayOpen) { $(overlayOpen).hidden = true; overlayOpen = null; } }

function pauseGame() {
  if (view !== "game" || !S || S.done || overlayOpen) return;
  stopTimer(); saveGame();
  cardEl.classList.add("masked");

/** 화면의 모든 문자열을 현재 언어로 다시 쓴다. */
function applyLang(lang) {
  LANG = lang === "en" ? "en" : "ko";
  document.documentElement.lang = LANG;
  document.title = L().appName;

  const all = sel => (document.querySelectorAll ? document.querySelectorAll(sel) : []);
  for (const el of all("[data-i18n]")) {
    const v = L()[el.dataset.i18n];
    if (typeof v === "string") el.textContent = v;
  }
  for (const el of all("[data-i18n-aria]")) {
    const v = L()[el.dataset.i18nAria];
    if (typeof v === "string") el.setAttribute("aria-label", v);
  }

  // 버튼에는 지금 언어가 아니라 "누르면 갈 언어"를 보여 준다.
  const other = LANG === "ko" ? "EN" : "한";
  $("btnLang").textContent = other;
  $("btnLangHome").textContent = other;

  numEls.forEach((n, i) => n.btn.setAttribute("aria-label", L().padEnter(i + 1)));
  renderDiffList();
  store(KEY_LANG, LANG);
  if (S) updateView();
  if (view === "home") renderHome();
  if (overlayOpen === "ovDaily") renderCalendar();
}

function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  for (const id of ["btnTheme", "btnThemeHome"]) {
    const u = $(id).querySelector("use");
    if (u) u.setAttribute("href", t === "dark" ? "#i-sun" : "#i-moon");
  }
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", t === "dark" ? "#111420" : "#eef1f8");
  store(KEY_THEME, t);
}

/* ---------- 이벤트 ---------- */
boardEl.addEventListener("click", e => {
  const cell = e.target.closest(".cell");
  if (!cell) return;
  const i = Number(cell.dataset.i);
  if (settings.numberFirst && padSel && S && !S.done && !S.puzzle[i]) {
    select(i);
    placeDigit(i, padSel);
  } else {
    select(i);
  }
});
padEl.addEventListener("click", e => {
  const btn = e.target.closest(".num");
  if (!btn) return;
  const d = Number(btn.dataset.d);
  if (settings.numberFirst) {
    padSel = padSel === d ? 0 : d;   // 같은 숫자를 다시 누르면 해제
    buzz(6);
    updateView();
  } else {
    inputDigit(d);
  }
});
$("btnUndo").addEventListener("click", undo);
$("btnRedo").addEventListener("click", redo);
$("btnErase").addEventListener("click", eraseCell);
$("btnHint").addEventListener("click", showHint);
$("btnHintClose").addEventListener("click", dismissHint);
$("btnHintApply").addEventListener("click", applyHint);
$("btnNotes").addEventListener("click", () => {
  if (!S || S.done) return;
  S.notesMode = !S.notesMode;
  buzz(6);
  updateView();
});
$("btnPause").addEventListener("click", pauseGame);
$("btnResume").addEventListener("click", resumeGame);
$("btnStatsClose").addEventListener("click", () => {
  closeOverlay();
  if (view === "game" && S && !S.done) startTimer(); else if (view === "home") renderHome();
});
/** 되돌릴 수 없는 동작 앞에 한 번 묻는다. */
let confirmPending = null;
function askConfirm(title, desc, yesLabel, onYes) {
  confirmPending = onYes;
  $("confirmTitle").textContent = title;
  $("confirmDesc").textContent = desc;
  $("btnConfirmYes").textContent = yesLabel;
  openOverlay("ovConfirm");
}
$("btnConfirmNo").addEventListener("click", () => { confirmPending = null; openStats(); });
$("btnConfirmYes").addEventListener("click", () => {
  const fn = confirmPending;
  confirmPending = null;
  if (fn) fn();
});

$("btnStatsReset").addEventListener("click", () => {
  // 한 번 누르면 되돌릴 수 없다. 지금까지의 기록이 전부 사라지므로 반드시 묻는다.
  askConfirm(L().clearTitle, L().clearDesc, L().clearYes,
             () => { drop(KEY_STATS); openStats(); });
});
$("btnNew").addEventListener("click", openNewGame);
$("btnNewCancel").addEventListener("click", () => {
  closeOverlay();
  if (view === "game" && S && !S.done) startTimer();
});
$("diffList").addEventListener("click", e => {
  const item = e.target.closest(".diff-item");
  if (item) startGame(item.dataset.key);
});
$("btnResultClose").addEventListener("click", closeOverlay);
$("btnResultNew").addEventListener("click", openNewGame);
$("btnTheme").addEventListener("click", toggleTheme);
function toggleLang() { applyLang(LANG === "ko" ? "en" : "ko"); buzz(6); }
function toggleTheme() {
  applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
}
$("btnLang").addEventListener("click", toggleLang);
$("btnLangHome").addEventListener("click", toggleLang);
$("btnThemeHome").addEventListener("click", toggleTheme);

$("btnHome").addEventListener("click", showHome);
$("btnHomeNew").addEventListener("click", openNewGame);
$("btnHomeDaily").addEventListener("click", openDaily);
$("btnHomeStats").addEventListener("click", openStats);
$("btnHomeResume").addEventListener("click", () => {
  const saved = restoreGame();
  if (!saved) { renderHome(); return; }
  S = saved;
  hint = null;
  $("hintBar").hidden = true;
  cardEl.classList.remove("masked", "solved");
  showGame();
  updateView();
  paintTimer();
  startTimer();
});
$("optAutoNotes").addEventListener("click", () => {
  const next = !autoNotesOn();
  store(KEY_AUTONOTE, next);
  $("optAutoNotes").setAttribute("aria-pressed", String(next));
  buzz(6);
});
$("btnSettings").addEventListener("click", openSettings);
$("btnSettingsClose").addEventListener("click", closeOverlay);
$("settingList").addEventListener("click", e => {
  const row = e.target.closest(".optrow");
  if (!row) return;
  const key = row.dataset.key;
  const next = row.getAttribute("aria-pressed") !== "true";
  if (key === "autoNotes") store(KEY_AUTONOTE, next);
  else setSetting(key, next);
  row.setAttribute("aria-pressed", String(next));
  buzz(6);
  if (!settings.numberFirst) padSel = 0;
  if (S) updateView();
  paintTimer();
});
$("btnHelp").addEventListener("click", openHelp);
$("btnHelpClose").addEventListener("click", () => {
  store(KEY_SEEN, true);
  closeOverlay();
});
$("calPrev").addEventListener("click", () => shiftMonth(-1));
$("calNext").addEventListener("click", () => shiftMonth(1));
$("btnDailyClose").addEventListener("click", closeOverlay);
$("calGrid").addEventListener("click", e => {
  const cell = e.target.closest(".cal-cell");
  if (cell && cell.dataset.key && !cell.disabled) startDaily(cell.dataset.key);
});

document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (view !== "game") return;
  if (overlayOpen) {
    if (e.key === "Escape") { closeOverlay(); if (S && !S.done) startTimer(); }
    return;
  }
  const k = e.key;
  if (k >= "1" && k <= "9") { inputDigit(Number(k)); e.preventDefault(); return; }
  switch (k) {
    case "ArrowUp":    moveSelection(-1, 0); e.preventDefault(); break;
    case "ArrowDown":  moveSelection(1, 0);  e.preventDefault(); break;
    case "ArrowLeft":  moveSelection(0, -1); e.preventDefault(); break;
    case "ArrowRight": moveSelection(0, 1);  e.preventDefault(); break;
    case "Backspace": case "Delete": case "0": eraseCell(); e.preventDefault(); break;
    case "n": case "N": $("btnNotes").click(); break;
    case "h": case "H": showHint(); break;
    case "z": case "Z": undo(); break;
    case "y": case "Y": redo(); break;
    case " ": pauseGame(); e.preventDefault(); break;
  }
});

// 앱이 가려지면 시간이 계속 흐르지 않게 멈추고 저장한다
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { stopTimer(); saveGame(); }
  else if (view === "game" && S && !S.done && !overlayOpen) startTimer();
});

/* ---------- 시작 ---------- */
loadSettings();
buildBoard();
buildPad();

// 저장된 선택이 있으면 그것을, 없으면 기기 언어를 따른다.
applyLang(load(KEY_LANG) ||
  (String(navigator.language || "").toLowerCase().startsWith("ko") ? "ko" : "en"));

applyTheme(load(KEY_THEME) ||
  (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"));

// 앱은 Home 으로 시작한다. 진행 중이던 게임은 "이어하기" 로 들어간다.
showHome();

// 처음 쓰는 사람에게는 무엇을 할 수 있는지 한 번 보여 준다.
if (load(KEY_SEEN) !== true) openHelp();

setInterval(() => {
  if (view !== "game") return;
  paintTimer();
  if (S && !S.done && tRunning) saveGame();
}, 1000);

/* ---------- service worker (오프라인 실행 · 앱 설치) ---------- */
// https 또는 localhost 에서만 등록된다. file:// 로 열면 조용히 건너뛴다.
if ("serviceWorker" in navigator &&
    (location.protocol === "https:" || ["localhost", "127.0.0.1"].includes(location.hostname))) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => { /* 실패해도 앱은 그대로 동작 */ });
  });
  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (reloading) return;
    reloading = true;
    location.reload();
  });
}
</script>
</body>
</html>
